<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>字店原型 · 文风字体</title>
  <link rel="stylesheet" href="css/wenfeng.css" />
  <link rel="icon" type="image/webp" href="assets/icon.webp" />
</head>
<body class="page-shop">
  <header class="site-chrome">
    <div class="site-chrome-inner">
      <ul class="brush-nav">
        <li class="icon"><a class="brand" href="index.html"><img src="assets/icon.webp" alt="" width="36" height="36" /></a></li>
        <li><a href="index.html">首页</a></li>
        <li><a href="fonts.html">字体库</a></li>
        <li><a href="docs.html">文档</a></li>
      </ul>
      <div class="site-chrome-end">
        <div class="nav-search">
          <input type="search" id="navSearch" placeholder="搜索字体" aria-label="搜索字体" autocomplete="off" />
          <button type="button" class="nav-search-clear" id="navSearchClear" hidden aria-label="清除">×</button>
          <span class="nav-search-icon" aria-hidden="true"><i data-lucide="search"></i></span>
        </div>
        <a class="bag-link" href="shopping-bag.html" aria-label="已获取字体">
          <i data-lucide="shopping-bag"></i>
          <span class="badge" data-pick-count data-count="0">0</span>
        </a>
      </div>
    </div>
  </header>

  <div class="shop-wrap" id="shopRoot">
    <p class="detail-loading">正在加载…</p>
  </div>

  <a class="affix-bag" href="shopping-bag.html" aria-label="选字袋">
    <i data-lucide="shopping-bag"></i>
    <span class="badge" data-pick-count data-count="0">0</span>
  </a>
  <footer id="wfExtraFooter" class="site-extra-footer"></footer>

  <script src="https://registry.npmmirror.com/lucide/0.469.0/files/dist/umd/lucide.min.js"></script>
  <script src="js/wf-proto.js"></script>
  <script>
    (function () {
      const GLYPHS = '永天地玄黄宇宙洪荒日月盈昃辰宿列张寒来暑往秋收冬藏ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
      const root = document.getElementById('shopRoot');
      const id = WFProto.getQuery('id') || '7fdcfd07-864d-49a1-8727-b51d78316e0b';
      function esc(s) { return WFProto.escapeHtml(s); }
      function paintIcons() {
        if (window.lucide && lucide.createIcons) {
          lucide.createIcons({ attrs: { 'stroke-width': 1.75, width: 15, height: 15 } });
        }
      }

      WFProto.loadCatalog().then(function () {
        const font = WFProto.getFont(id);
        if (!font) { root.innerHTML = '<p>未找到该字体。</p>'; return; }
        document.title = font.name + ' · 字店原型';
        const stack = WFProto.cssFamilyStack(font.family);
        const weights = font.weights && font.weights.length ? font.weights : ['Regular'];
        const start = weights.filter(function (w) {
          return String(w).toLowerCase() === 'regular' || WFProto.weightToCss(w) === '400';
        })[0] || weights[0];
        const firstW = WFProto.weightToCss(start);
        weights.forEach(function (w) { WFProto.ensureFontCss(font.family, w); });

        const brandRaw = (font.brand && font.brand.name) || font.foundry || '';
        const brand = String(brandRaw).split(/[;；]/)[0].trim() || brandRaw;
        const brandAvatar = (font.brand && font.brand.logoUrl) || font.foundryAvatar ||
          (font.brand && font.brand.avatarUrl) || '';
        const brandCount = WFProto.getCatalogList().filter(function (f) {
          const n = String((f.brand && f.brand.name) || f.foundry || '').split(/[;；]/)[0].trim();
          return n && n === brand;
        }).length;
        const licUrl = font.licenseFileUrl || font.licenseUrl || '';
        const tags = font.tags || [];
        const designer = font.designerShort || font.designer || '';
        const uses = Array.isArray(font.useCases) ? font.useCases : [];
        const licNote = font.licenseNotes || WFProto.licenseCanDo(font);

        const meta = [];
        if (font.en) meta.push('<span>' + esc(font.en) + '</span>');
        if (font.category) {
          meta.push('<a href="fonts.html?keyword=' + encodeURIComponent(font.category) + '">' +
            esc(font.category) + '</a>');
        }
        meta.push('<span>' + esc(font.license || '待核实') + '</span>');
        meta.push('<span>' + weights.length + ' 字重</span>');

        const weightBtns = weights.map(function (w) {
          const on = String(w) === String(start);
          return '<button type="button"' + (on ? ' class="active"' : '') +
            ' data-w="' + esc(WFProto.weightToCss(w)) + '">' + esc(w) + '</button>';
        }).join('');
        const versions = WFProto.CSS_VERSIONS.map(function (v, i) {
          return '<button type="button" class="' + (i === 0 ? 'is-on' : '') +
            '" data-version="' + esc(v.id) + '">' + esc(v.id) + '</button>';
        }).join('');

        const mark = brandAvatar
          ? '<img src="' + esc(brandAvatar) + '" alt="" width="36" height="36" loading="lazy" onerror="this.remove()" />'
          : '<span class="shop-mark">' + esc(String(brand || '文').charAt(0)) + '</span>';

        const rel = WFProto.relatedFonts(font, 6);
        rel.forEach(function (f) {
          WFProto.ensureFontCss(f.family, (f.weights && f.weights[0]) || '400');
        });
        const relHtml = rel.map(function (f) {
          const st = WFProto.cssFamilyStack(f.family);
          const w = WFProto.weightToCss((f.weights && f.weights[0]) || '400');
          const line = [f.license || '待核实', f.category].filter(Boolean).join(' · ');
          return '<a class="shop-rel-row" href="shop-proto.html?id=' + encodeURIComponent(f.id) + '">' +
            '<span class="shop-rel-name" style="font-family:' + esc(st) + ';font-weight:' + esc(w) + '">' +
              esc(f.name) + '</span>' +
            '<span class="shop-rel-meta">' + esc(line) + '</span></a>';
        }).join('');

        const glyphs = GLYPHS.split('').map(function (ch) {
          return '<span>' + esc(ch) + '</span>';
        }).join('');

        const spec = [
          ['版本', font.version ? esc(font.version) : ''],
          ['字重', esc(String(weights.length))],
          ['分类', font.category
            ? '<a href="fonts.html?keyword=' + encodeURIComponent(font.category) + '">' + esc(font.category) + '</a>'
            : ''],
          ['字符', font.charCount ? esc(WFProto.formatCount(font.charCount)) : '']
        ].filter(function (r) { return r[1]; });
        const specHtml = spec.length
          ? '<dl class="shop-kv">' + spec.map(function (r) {
              return '<div><dt>' + esc(r[0]) + '</dt><dd>' + r[1] + '</dd></div>';
            }).join('') + '</dl>'
          : '';

        const tagLinks = tags.map(function (t) {
          return '<a href="fonts.html?tag=' + encodeURIComponent(t) + '">' + esc(t) + '</a>';
        }).concat(uses.map(function (t) {
          return '<a href="fonts.html?keyword=' + encodeURIComponent(t) + '">' + esc(t) + '</a>';
        })).join('');

        root.innerHTML =
          '<div class="shop-top">' +
            '<nav class="shop-crumb" aria-label="面包屑">' +
              '<a href="fonts.html">字体库</a><span class="sep">/</span><span>' + esc(font.name) + '</span>' +
            '</nav>' +
            '<button type="button" class="shop-join" id="btnJoin" data-join="' + esc(font.id) +
              '" data-name="' + esc(font.name) + '" data-op-detail>添加字体</button>' +
          '</div>' +
          '<div class="shop-grid">' +
            '<div class="shop-main">' +
              '<h1 class="shop-cloth" id="cloth" style="font-family:' + esc(stack) +
                ';font-weight:' + esc(firstW) + '">' + esc(font.name) + '</h1>' +
              '<p class="shop-meta">' + meta.join('') + '</p>' +
              '<div class="shop-tools">' +
                '<div class="preview-input-wrap">' +
                  '<input type="text" id="previewInput" maxlength="80" placeholder="输入预览文字" aria-label="预览文字" />' +
                '</div>' +
                '<div class="size-slider">' +
                  '<input type="range" id="shopSize" min="48" max="180" value="136" aria-label="字号" />' +
                '</div>' +
                '<div class="shop-weights" role="group" aria-label="字重">' + weightBtns + '</div>' +
              '</div>' +
              '<p class="shop-caption">' +
                '<code id="familyCode" title="复制 family">' + esc(font.family) + '</code>' +
                '<code id="cssLine" title="复制 CSS"></code>' +
                versions +
                '<button type="button" id="btnCopy">复制</button>' +
                '<a href="font-embed.html?id=' + encodeURIComponent(font.id) + '">说明</a>' +
              '</p>' +
              '<details class="shop-glyphs-fold">' +
                '<summary>查看字符</summary>' +
                '<div class="shop-glyphs" id="glyphs" style="font-family:' + esc(stack) +
                  ';font-weight:' + esc(firstW) + '">' + glyphs + '</div>' +
              '</details>' +
            '</div>' +
            '<aside class="shop-side" aria-label="字体资料">' +
              '<div class="shop-foundry">' + mark +
                '<div>' +
                  '<strong>' + esc(brand || '—') + '</strong>' +
                  '<p><a href="fonts.html?keyword=' + encodeURIComponent(brand) + '">在库 ' +
                    brandCount + ' 款</a>' +
                    (designer && designer !== '—' ? ' · ' + esc(designer) : '') +
                  '</p>' +
                '</div>' +
              '</div>' +
              '<div class="shop-colophon">' +
                '<p>' + esc(font.license || '待核实') +
                  (licUrl ? ' · <a href="' + esc(licUrl) + '" target="_blank" rel="noopener noreferrer">原文</a>' : '') +
                  '<br>' + esc(licNote) +
                '</p>' +
                specHtml +
                (tagLinks ? '<p class="shop-tags">' + tagLinks + '</p>' : '') +
              '</div>' +
            '</aside>' +
          '</div>' +
          (relHtml
            ? '<section class="shop-also" aria-label="相关字体"><h2>相关字体</h2><div>' +
                relHtml + '</div></section>'
            : '');

        const cloth = document.getElementById('cloth');
        const input = document.getElementById('previewInput');
        const size = document.getElementById('shopSize');
        let weight = firstW;
        let version = 'full';
        input.value = font.name;

        function applySize(px) {
          size.value = String(px);
          cloth.style.fontSize = px + 'px';
        }
        function currentUrl() { return WFProto.cssUrl(font.family, weight, version); }
        function paintUrl() {
          const line = document.getElementById('cssLine');
          if (line) line.textContent = currentUrl();
        }
        function flash(el, text) {
          const old = el.textContent;
          el.textContent = text || '已复制';
          setTimeout(function () { el.textContent = old; }, 1100);
        }
        applySize(136);
        paintUrl();

        input.addEventListener('input', function () {
          cloth.textContent = input.value || font.name;
        });
        size.addEventListener('input', function () { applySize(size.value); });
        document.querySelectorAll('[data-w]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            document.querySelectorAll('[data-w]').forEach(function (b) {
              b.classList.toggle('active', b === btn);
            });
            weight = btn.getAttribute('data-w') || '400';
            cloth.style.fontWeight = weight;
            document.getElementById('glyphs').style.fontWeight = weight;
            WFProto.ensureFontCss(font.family, weight);
            paintUrl();
          });
        });
        document.querySelectorAll('[data-version]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            document.querySelectorAll('[data-version]').forEach(function (b) {
              b.classList.toggle('is-on', b === btn);
            });
            version = btn.getAttribute('data-version') || 'full';
            paintUrl();
          });
        });
        document.getElementById('cssLine').addEventListener('click', function () {
          const el = this;
          WFProto.copyText(currentUrl()).then(function () { flash(el); });
        });
        document.getElementById('familyCode').addEventListener('click', function () {
          const el = this;
          WFProto.copyText(font.family).then(function () { flash(el); });
        });
        document.getElementById('btnCopy').addEventListener('click', function () {
          const el = this;
          WFProto.copyText(currentUrl()).then(function () { flash(el); });
        });
        document.getElementById('btnJoin').addEventListener('click', function (e) {
          e.preventDefault();
          WFProto.togglePick(font.id, font.name);
        });
        WFProto.syncJoinButtons();
        paintIcons();
      });
      paintIcons();
    })();
  </script>
</body>
</html>
