<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <script>try{if(localStorage.getItem("wf-theme")==="dark")document.documentElement.setAttribute("data-theme","dark")}catch(e){}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>谱系 · 关系图实验室 · 文风字体</title>
  <meta name="robots" content="noindex" />
  <link rel="stylesheet" href="css/fonts.css?v=20260925k" />
  <link rel="stylesheet" href="css/tokens.css?v=20260925k" />
  <link rel="stylesheet" href="css/base.css?v=20260925k" />
  <link rel="stylesheet" href="css/components.css?v=20260925k" />
  <link rel="stylesheet" href="css/site.css?v=20260925k" />
  <link rel="stylesheet" href="css/lineage-flow-lab.css?v=20260925k" />
  <link rel="icon" type="image/webp" href="assets/icon.webp" />
</head>
<body class="page-lfl">
  <header data-topbar data-active="fonts"></header>

  <div class="lfl-switch">
    <div class="container lfl-switch-inner">
      <p class="lfl-lead">实验室 · <b>激活</b>≈TheBrain 邻域（点卡重布）；模式可切 · 现网 <a href="lineage.html">lineage.html</a> 未改 · 大族默认激活，小族默认图</p>
      <div class="lfl-fams" id="famNav" aria-label="字族"></div>
      <div class="lfl-clusters" id="clusterNav" aria-label="主题支" hidden></div>
      <div class="lfl-tools" role="toolbar" aria-label="画布与模式">
        <div class="lfl-modes" id="modeNav" role="group" aria-label="模式">
          <button type="button" class="chip lfl-mode" data-mode="plex" title="TheBrain 邻域 · 点卡激活重布（大族默认）">激活</button>
          <button type="button" class="chip lfl-mode" data-mode="flow" title="左→右衍生导图（小族默认）">图</button>
          <button type="button" class="chip lfl-mode" data-mode="cluster" title="主题支折叠 · 宽扇叶收成可展开支">簇</button>
          <button type="button" class="chip lfl-mode" data-mode="wall" title="标本墙 · 扫主题支成员">墙</button>
        </div>
        <span class="lfl-tools-sep" aria-hidden="true"></span>
        <button type="button" class="lfl-tool" id="btnZoomOut" title="缩小">−</button>
        <button type="button" class="lfl-tool" id="btnZoomIn" title="放大">+</button>
        <button type="button" class="lfl-tool" id="btnReset" title="重置视图">重置</button>
        <span class="lfl-zoom" id="zoomLabel">100%</span>
        <span class="lfl-hint" id="modeHint">滚轮缩放 · 拖拽平移 · 点卡片高亮边</span>
      </div>
    </div>
  </div>

  <main class="lfl-main">
    <div class="container">
      <p class="lfl-cap" id="famCap"></p>
    </div>
    <div class="lfl-viewport" id="viewport" tabindex="0" aria-label="谱系关系图画布">
      <div class="lfl-stage" id="stage">
        <svg class="lfl-edges" id="edges" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"></svg>
        <div class="lfl-nodes" id="nodes"></div>
      </div>
      <div class="lfl-wall" id="wall" hidden></div>
      <div class="lfl-plex-pick" id="plexPick" hidden></div>
      <p class="lfl-empty" id="empty" hidden>暂无谱系数据。</p>
    </div>
    <div class="container">
      <p class="lfl-note" id="footNote"></p>
    </div>
  </main>

  <script src="js/wf-proto.js?v=20260927p"></script>
  <script src="js/wf-chrome.js?v=20260927e"></script>
  <script src="js/wf-specimen.js?v=20260923j"></script>
  <script src="js/pages/lineage-flow-lab.js?v=20260925k"></script>
</body>
</html>
