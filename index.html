<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <script>try{if(localStorage.getItem("wf-theme")==="dark")document.documentElement.setAttribute("data-theme","dark");if(localStorage.getItem("wf-view")==="dev")document.documentElement.setAttribute("data-view","dev")}catch(e){}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>文风字体 · 中文 Webfonts 云服务</title>
  <meta name="description" content="合法、高速、稳定地在网页上使用中文字体：托管、子集化、域名白名单，一行代码接入。" />
  <link rel="stylesheet" href="css/fonts.css" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/specimen.css" />
  <link rel="stylesheet" href="css/site.css" />
  <link rel="icon" type="image/webp" href="assets/icon.webp" />
</head>
<body class="page-index">
  <header data-topbar data-active="home"></header>

  <main>
    <section class="home-hero">
      <div class="container">
        <div class="home-hero-top">
          <p class="kicker">中文 Webfonts 云服务</p>
          <p class="live-caption"><span>正在使用</span><a class="now" id="liveName" href="fonts.html">—</a><button type="button" id="liveNext"><svg class="icon" aria-hidden="true"><use href="assets/icons.svg#i-refresh"/></svg>换一款</button></p>
        </div>
        <h1 class="live" id="live" contenteditable="true" spellcheck="false" aria-label="可编辑的活样张" data-placeholder="写几个字试试">让中文字体，<br>在网页上流动。</h1>
        <div class="home-hero-foot">
          <p class="lead">托管、子集化、域名白名单，一行代码接入。每款字的授权以出处原文为准。</p>
          <div class="home-cta">
            <a class="btn btn-ink btn-lg" href="fonts.html">浏览字体库</a>
            <a class="btn btn-lg" href="docs.html">查看文档</a>
          </div>
        </div>
      </div>
    </section>

    <div id="controlbar"></div>

    <div class="container">
      <div class="lib has-side">
        <aside class="lib-rail" id="libRail" aria-label="筛选"></aside>
        <section>
          <div class="count-line row-between">
            <span id="countLine">正在加载字体目录…</span>
            <div class="lib-active" id="activeFilters"></div>
            <label class="lib-sort"><span class="sr-only">排序</span><select class="select" id="sortSel" aria-label="排序"><option value="featured">推荐排序</option><option value="name">按名称</option><option value="weights">字重多到少</option><option value="newest">最新发布</option></select></label>
          </div>
          <ul class="specimens" id="fontList"></ul>
          <div class="load-more"><button type="button" class="btn" id="loadMore" hidden>加载更多</button></div>
          <div id="listSentinel" aria-hidden="true"></div>
        </section>
        <aside class="lib-side" id="libSide" aria-label="当前字体"></aside>
      </div>
    </div>

    <section class="stats-band" aria-label="字体库统计"><div class="container" id="statsBand"></div></section>
  </main>

  <footer id="wfExtraFooter"></footer>

  <script src="js/wf-proto.js"></script>
  <script src="js/wf-chrome.js"></script>
  <script src="js/wf-specimen.js"></script>
  <script src="js/wf-embed.js"></script>
  <script src="js/pages/fonts.js"></script>
  <script src="js/pages/home.js"></script>
</body>
</html>
