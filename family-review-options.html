<html lang="zh-CN">
<head>

<title>family 对照 · 可改草案</title>
<style>
  :root { --ink:#111; --gray:#666; --line:#e6e6e6; --paper:#fff; --fill:#f6f6f6; --chg:#fff4e0; --col:#ffe8e8; --pin:#e8f5e9; --dirty:#e8f0ff; --lock:#f3f4f6; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:var(--ink); background:var(--paper); }
  header { position:sticky; top:0; z-index:2; background:var(--paper); border-bottom:1px solid var(--line); padding:12px 20px 10px; }
  h1 { margin:0 0 6px; font-size:18px; font-weight:600; }
  .sub { color:var(--gray); font-size:13px; margin:0 0 10px; }
  .bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .bar + .bar { margin-top:8px; }
  input[type=search] { flex:1; min-width:200px; height:36px; border:1px solid var(--line); border-radius:6px; padding:0 10px; font:inherit; }
  button { height:32px; border:1px solid var(--line); background:var(--fill); border-radius:999px; padding:0 12px; font:inherit; cursor:pointer; }
  button.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  button.save { background:#111; color:#fff; border-color:#111; }
  button.save:disabled { opacity:.4; cursor:default; }
  button.warn { background:#fff4e0; }
  .count { color:var(--gray); font-size:13px; }
  #status { font-size:13px; color:var(--gray); }
  #status.ok { color:#166534; }
  #status.err { color:#b91c1c; }
  table { width:100%; border-collapse:collapse; }
  th,td { text-align:left; padding:7px 10px; border-bottom:1px solid var(--line); vertical-align:middle; }
  th { position:sticky; top:var(--head-h, 168px); background:var(--fill); font-size:12px; font-weight:600; color:var(--gray); }
  tr.chg td { background:var(--chg); }
  tr.col td { background:var(--col); }
  tr.pin td { background:var(--pin); }
  tr.dirty td { background:var(--dirty); }
  tr.lock td { background:var(--lock); }
  tr.lock.col td { background:#f3e8e8; }
  code, .mono { font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace; }
  td.draft input { width:22rem; max-width:42vw; height:30px; border:1px solid var(--line); border-radius:4px; padding:0 8px; font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace; }
  td.draft input:disabled { background:#eee; color:#333; }
  td.ck, th.ck { width:36px; text-align:center; padding-left:8px; padding-right:4px; }
  td.ck input, th.ck input { width:16px; height:16px; }
  .n { color:var(--gray); width:40px; }
  .note { color:var(--gray); font-size:12px; white-space:nowrap; }
  tr.hide { display:none; }
  #tb tr { user-select: none; }
  #tb td.draft, #tb td.draft input { user-select: text; }
</style>
</head>
<body>
<header>
  <h1>family 对照 · 可改草案</h1>
  <p class="sub">本页不上公网。表序：撞码 → 两字母 → 三字母 → 其余。Shift 点选连选当前可见行。写入 <code>data/family-review-edits.json</code>。</p>
  <div class="bar">
    <input type="search" id="q" placeholder="搜中文名 / 英文 / family / 草案" />
    <button type="button" data-f="" class="on">全部</button>
    <button type="button" data-f="unlocked">未锁定</button>
    <button type="button" data-f="ok">可批量</button>
    <button type="button" data-f="short">短码待扩</button>
    <button type="button" data-f="col">撞码</button>
    <button type="button" data-f="dirty">我改过的</button>
    <button type="button" data-f="locked">已锁定</button>
    <button type="button" data-f="chg">将改</button>
    <button type="button" data-f="same">不动</button>
    <button type="button" data-f="pin">点名四条</button>
  </div>
  <div class="bar">
    <button type="button" id="selvis">勾选可见</button>
    <button type="button" id="selnone">清勾选</button>
    <button type="button" id="locksel">锁定勾选</button>
    <button type="button" id="unlocksel">解锁勾选</button>
    <button type="button" id="roit3" class="warn">*roit 套三字母</button>
    <button type="button" class="save" id="save">保存</button>
    <span class="count" id="c"></span>
    <span id="status"></span>
  </div>
</header>
<table>
  <thead>
    <tr>
      <th class="ck"><input type="checkbox" id="selall" title="勾选可见"></th>
      <th>#</th>
      <th>中文/原名</th>
      <th>英文</th>
      <th>现在 family</th>
      <th>草案（可改）</th>
      <th></th>
    </tr>
  </thead>
  <tbody id="tb"></tbody>
</table>

    });
    return m;
  }
  function batchOf(r, draft, collide, dirty){
    if (collide) return "col";
    if (r.rule === "点名") return "pin";
    if (dirty) return "dirty";
    const body = bodyOf(draft);
    if (String(r.rule||"").indexOf("英文")>=0 && body.length <= 2) return "short";
    if (draft === r.family) return "keep";
    if (r.rule === "中文拼音") return "zh";
    return "en";
  }
  function isOk(batch){
    return batch==="keep" || batch==="zh" || batch==="en" || batch==="pin";
  }
  function setHeadH(){
    const h = document.querySelector("header");
    if (h) document.documentElement.style.setProperty("--head-h", h.offsetHeight + "px");
  }
  function persistLocal(){
    try {
      localStorage.setItem("wf-family-review-edits", JSON.stringify({ drafts: drafts, locked: locked }));
    } catch(e) {}
  }
  function rowState(r){
    const k = keyOf(r);
    const draft = drafts[k] || r.draft;
    const col = collideMap();
    const collide = (col[draft] || 0) > 1;
    const dirty = draft !== r.draft;
    const changed = draft !== r.family;
    const isLock = !!locked[k];
    const batch = batchOf(r, draft, collide, dirty);
    return { k, draft, collide, dirty, changed, isLock, batch };
  }
  function rowOf(tr){
    const i = Number(tr.getAttribute("data-i"));
    return seed[i];
  }
  function rowRank(r){
    const st = rowState(r);
    const b = bodyOf(st.draft);
    if (st.collide) return 0;
    if (b.length <= 2) return 1;
    if (b.length === 3) return 2;
    return 3;
  }
  function orderedIdx(){
    return seed.map(function(r, i){
      const st = rowState(r);
      return {i:i, rank:rowRank(r), len: bodyOf(st.draft).length};
    }).sort(function(a, b){ return a.rank - b.rank || a.len - b.len || a.i - b.i; })
      .map(function(x){ return x.i; });
  }
  function flagOf(st, r){
    if (st.isLock) return "locked";
    if (st.dirty) return "dirty";
    if (r.rule==="点名") return "pin";
    if (st.collide) return "col";
    if (st.batch==="short") return "short";
    if (isOk(st.batch) && !st.isLock) return "ok";
    return st.changed ? "chg" : "same";
  }
  function noteOf(r, st){
    return [r.rule, st.collide?"撞码":"", st.dirty?"已改":"", st.changed?"将改":"不动", st.isLock?"已锁定":"", st.batch==="short"?"短码":"", isOk(st.batch)&&!st.collide?"可批量":""].filter(Boolean).join(" · ");
  }
  function paintRow(tr, r){
    const st = rowState(r);
    tr.className = [st.changed?"chg":"", st.collide?"col":"", r.rule==="点名"?"pin":"", st.dirty?"dirty":"", st.isLock?"lock":""].filter(Boolean).join(" ");
    tr.setAttribute("data-flag", flagOf(st, r));
    tr.setAttribute("data-batch", st.batch);
    tr.setAttribute("data-k", st.k);
    const qstr = [r.name, r.en, r.family, st.draft, r.rule].join(" ").toLowerCase();
    tr.setAttribute("data-q", qstr);
    const ck = tr.querySelector(".ck input");
    if (ck) ck.checked = !!checked[st.k];
    const inp = tr.querySelector(".draft input");
    if (inp) {
      inp.value = st.draft;
      inp.disabled = st.isLock;
    }
    tr.querySelector(".note").textContent = noteOf(r, st);
  }
  function render(){
    const idx = orderedIdx();
    tb.innerHTML = idx.map(function(i){
      return '<tr data-i="'+i+'">'+
        '<td class="ck"><input type="checkbox"></td>'+
        '<td class="n">'+(i+1)+'</td>'+
        '<td class="name"></td>'+
        '<td class="en"></td>'+
        '<td class="cur"><code></code></td>'+
        '<td class="draft"><input spellcheck="false"></td>'+
        '<td class="note"></td></tr>';
    }).join("");
    [...tb.querySelectorAll("tr")].forEach(function(tr){
      const r = rowOf(tr);
      tr.querySelector(".name").textContent = r.name;
      tr.querySelector(".en").textContent = r.en;
      tr.querySelector(".cur code").textContent = r.family;
      paintRow(tr, r);
    });
    setHeadH();
    filter();
  }
  function setRowChecked(tr, on){
    const k = tr.getAttribute("data-k");
    if (!k) return;
    if (on) checked[k] = true;
    else delete checked[k];
    const inp = tr.querySelector(".ck input");
    if (inp) inp.checked = !!on;
  }
  function applyCheck(tr, on, shift){
    const vis = visibleRows();
    const idx = vis.indexOf(tr);
    if (idx < 0) return;
    const k = tr.getAttribute("data-k");
    if (shift && lastVisKey) {
      const from = vis.findIndex(function(row){ return row.getAttribute("data-k")===lastVisKey; });
      if (from >= 0) {
        const a = Math.min(from, idx);
        const b = Math.max(from, idx);
        for (let i = a; i <= b; i++) setRowChecked(vis[i], on);
        filter();
        return;
      }
    }
    setRowChecked(tr, on);
    lastVisKey = k;
    filter();
  }
  tb.addEventListener("change", function(ev){
    if (ev.target.matches(".draft input")) onEdit(ev);
  });
  tb.addEventListener("focusout", function(ev){
    if (ev.target.matches(".draft input")) onEdit(ev);
  });
  tb.addEventListener("mousedown", function(ev){
    if (ev.shiftKey && !ev.target.closest(".draft")) ev.preventDefault();
  });
  tb.addEventListener("click", function(ev){
    if (ev.target.closest(".ck input")) {
      const tr = ev.target.closest("tr");
      applyCheck(tr, ev.target.checked, ev.shiftKey);
      return;
    }
    if (ev.target.closest(".draft")) return;
    const tr = ev.target.closest("tr");
    if (!tr || tr.parentNode !== tb) return;
    const k = tr.getAttribute("data-k");
    const on = ev.shiftKey ? true : !checked[k];
    applyCheck(tr, on, ev.shiftKey);
  });
  function onEdit(ev){
    const tr = ev.target.closest("tr");
    const k = tr.getAttribute("data-k");
    if (locked[k]) return;
    const v = normDraft(ev.target.value);
    drafts[k] = v;
    ev.target.value = v;
    persistLocal();
    const r = seed.find(function(x){ return keyOf(x)===k; });
    paintRow(tr, r);
    tb.querySelectorAll("tr").forEach(function(other){
      const rr = rowOf(other);
      const st = rowState(rr);
      if (st.draft === v || other === tr) paintRow(other, rr);
    });
    filter();
  }
  function visibleRows(){
    return [...tb.querySelectorAll("tr")].filter(function(tr){ return !tr.classList.contains("hide"); });
  }
  function filter(){
    const s = (q.value||"").trim().toLowerCase();
    let n=0, shown=0, dirtyN=0, lockN=0, unlockN=0, colN=0, okN=0, shortN=0;
    tb.querySelectorAll("tr").forEach(function(tr){
      n++;
      const r = rowOf(tr);
      const st = rowState(r);
      if (st.dirty) dirtyN++;
      if (st.isLock) lockN++; else unlockN++;
      if (st.collide) colN++;
      if (isOk(st.batch) && !st.isLock && !st.collide) okN++;
      if (st.batch==="short" && !st.isLock) shortN++;
      const f = tr.getAttribute("data-flag")||"";
      const batch = tr.getAttribute("data-batch")||"";
      const okF = !flag
        || (flag==="chg" && tr.classList.contains("chg"))
        || (flag==="same" && !tr.classList.contains("chg"))
        || (flag==="unlocked" && !st.isLock)
        || (flag==="locked" && st.isLock)
        || (flag==="ok" && isOk(batch) && !st.isLock && !st.collide)
        || (flag==="short" && batch==="short" && !st.isLock)
        || (flag==="col" && st.collide)
        || (flag==="dirty" && st.dirty)
        || (flag==="pin" && r.rule==="点名")
        || f===flag;
      const okQ = !s || (tr.getAttribute("data-q")||"").indexOf(s)!==-1
        || (tr.querySelector("input.draft, .draft input") && tr.querySelector(".draft input").value.toLowerCase().indexOf(s)!==-1)
        || (tr.querySelector(".name") && tr.querySelector(".name").textContent.toLowerCase().indexOf(s)!==-1);
      const on = okF && okQ;
      tr.classList.toggle("hide", !on);
      if (on) shown++;
    });
    c.textContent = shown + " / " + n + " · 未锁定 " + unlockN + " · 已锁定 " + lockN + " · 可批量 " + okN + " · 短码 " + shortN + " · 撞码 " + colN + (dirtyN ? " · 已改 "+dirtyN : "");
    const vis = visibleRows();
    const allOn = vis.length>0 && vis.every(function(tr){
      const k = tr.getAttribute("data-k");
      return checked[k];
    });
    document.getElementById("selall").checked = allOn;
  }
  q.addEventListener("input", filter);
  btns.forEach(function(b){
    b.addEventListener("click", function(){
      flag = b.getAttribute("data-f")||"";
      btns.forEach(function(x){ x.classList.toggle("on", x===b); });
      filter();
    });
  });
  document.getElementById("selall").addEventListener("change", function(ev){
    visibleRows().forEach(function(tr){
      const k = tr.getAttribute("data-k");
      if (ev.target.checked) checked[k] = true;
      else delete checked[k];
      tr.querySelector(".ck input").checked = ev.target.checked;
    });
  });
  document.getElementById("selvis").addEventListener("click", function(){
    visibleRows().forEach(function(tr){
      const k = tr.getAttribute("data-k");
      checked[k] = true;
      tr.querySelector(".ck input").checked = true;
    });
    filter();
  });
  document.getElementById("selnone").addEventListener("click", function(){
    Object.keys(checked).forEach(function(k){ delete checked[k]; });
    tb.querySelectorAll(".ck input").forEach(function(inp){ inp.checked = false; });
    document.getElementById("selall").checked = false;
  });
  function selectedKeys(){
    return Object.keys(checked).filter(function(k){ return checked[k]; });
  }
  document.getElementById("locksel").addEventListener("click", function(){
    const keys = selectedKeys();
    let n=0, skip=0;
    keys.forEach(function(k){
      const r = seed.find(function(x){ return keyOf(x)===k; });
      if (!r) return;
      const st = rowState(r);
      locked[k] = true;
      n++;
      if (st.collide) skip++;
    });
    persistLocal();
    render();
    status.textContent = "已锁定 " + n + " 条" + (skip ? "（其中撞码 "+skip+"，仍锁定，请回头改）" : "");
    status.className = skip ? "err" : "ok";
    filter();
  });
  document.getElementById("unlocksel").addEventListener("click", function(){
    const keys = selectedKeys();
    keys.forEach(function(k){ delete locked[k]; });
    persistLocal();
    render();
    status.textContent = "已解锁 " + keys.length + " 条";
    status.className = "ok";
    filter();
  });
  document.getElementById("roit3").addEventListener("click", function(){
    const map = {
      "Ubroit": "wenfeng-ubrjp",
      "Idroit": "wenfeng-idrjp",
      "Jeroit": "wenfeng-jerjp",
      "Roroit": "wenfeng-rorjp",
      "Viroit": "wenfeng-virjp"
    };
    let n=0;
    seed.forEach(function(r){
      const k = keyOf(r);
      if (locked[k]) return;
      const next = map[r.en] || map[r.name];
      if (next) { drafts[k] = next; n++; }
    });
    persistLocal();
    render();
    status.textContent = "已把未锁定 *roit 改成三字母+jp，共 " + n + " 条。勾选后锁定。";
    status.className = "ok";
    filter();
  });
  function payload(){
    return {
      savedAt: new Date().toISOString(),
      rows: seed.map(function(r){
        const k = keyOf(r);
        const draft = drafts[k] || r.draft;
        return {
          id: r.id,
          name: r.name,
          en: r.en,
          normalized: r.normalized,
          family: r.family,
          draft: draft,
          generated: r.draft,
          rule: r.rule,
          edited: draft !== r.draft,
          locked: !!locked[k]
        };
      })
    };
  }
  saveBtn.addEventListener("click", function(){
    status.textContent = "正在保存…";
    status.className = "";
    fetch("/family-review-save", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload())
    }).then(function(res){
      if (!res.ok) throw new Error("HTTP "+res.status);
      return res.json();
    }).then(function(){
      persistLocal();
      status.textContent = "已写入 data/family-review-edits.json";
      status.className = "ok";
    }).catch(function(err){
      status.textContent = "保存失败：请用本地 http://127.0.0.1:16043/family-review-options.html 打开。"+err.message;
      status.className = "err";
    });
  });
  function applyFile(file){
    let hadLock = false;
    if (file && file.rows) {
      file.rows.forEach(function(r){
        const k = String(r.normalized || r.id || r.name);
        if (r.draft) drafts[k] = r.draft;
        if (r.locked) { locked[k] = true; hadLock = true; }
      });
    }
    if (!hadLock) {
      const col = collideMap();
      seed.forEach(function(r){
        const k = keyOf(r);
        const draft = drafts[k] || r.draft;
        const collide = (col[draft]||0) > 1;
        const dirty = draft !== r.draft;
        if (!collide && (dirty || r.rule==="点名")) locked[k] = true;
      });
    }
  }
  try {
    const saved = JSON.parse(localStorage.getItem("wf-family-review-edits")||"{}");
    if (saved && saved.drafts) {
      Object.keys(saved.drafts).forEach(function(k){ if (saved.drafts[k]) drafts[k]=saved.drafts[k]; });
      if (saved.locked) Object.keys(saved.locked).forEach(function(k){ if (saved.locked[k]) locked[k]=true; });
    } else if (saved && typeof saved === "object") {
      Object.keys(saved).forEach(function(k){ if (typeof saved[k]==="string") drafts[k]=saved[k]; });
    }
  } catch(e) {}
  fetch("/data/family-review-edits.json", {cache:"no-store"}).then(function(r){
    if (!r.ok) return null;
    return r.json();
  }).then(function(file){
    applyFile(file);
  }).catch(function(){}).finally(render);
  window.addEventListener("resize", setHeadH);
})();
</script>
</body>
</html>
