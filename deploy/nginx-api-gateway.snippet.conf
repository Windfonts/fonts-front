# api.windfonts.com · 平台 API 网关壳
# 勿把本机 Next 进程当成「api=容器」；本 vhost 只是可换上游的反代入口。
# 当前上游 = fonts-vault（127.0.0.1:4000），转发 Host=vault.windfonts.com。
# 证书可用通配 *.windfonts.com（与 vault 同源）。

upstream windfonts_api_upstream {
    server 127.0.0.1:4000;
    keepalive 16;
}

server {
    listen 80;
    server_name api.windfonts.com;
    location /.well-known/acme-challenge/ { root /www/wwwroot/fonts-vault; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.windfonts.com;

    ssl_certificate     /www/server/panel/vhost/cert/api.windfonts.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/api.windfonts.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSLAPI:10m;

    location = /gateway/health {
        default_type application/json;
        return 200 '{"ok":true,"upstream":"vault","role":"platform-api-gateway"}';
    }

    location / {
        proxy_pass http://windfonts_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host vault.windfonts.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_hide_header X-Powered-By;
        add_header X-Windfonts-Gateway api always;
    }

    access_log /www/wwwlogs/windfonts-api-gateway.log;
    error_log  /www/wwwlogs/windfonts-api-gateway.error.log;
}
