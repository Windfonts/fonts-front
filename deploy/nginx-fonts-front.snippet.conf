# 文风公开站（静态 fonts-front）· 详情路径
# 挂到 server { ... } 内；root 指到仓根或构建产物。
# 验收：/fonts/ibmps → font-detail.html?slug=ibmps；未知 slug → 404.html

location = /fonts {
  return 301 /fonts.html;
}

location ~ ^/fonts/([A-Za-z0-9_-]+)/?$ {
  rewrite ^ /font-detail.html?slug=$1 last;
}

# 可选：旧 UUID 详情链（若仍有外链）
# location ~ ^/font-detail\.html$ { ... 见应用层 ?id= 兼容 }

error_page 404 /404.html;
