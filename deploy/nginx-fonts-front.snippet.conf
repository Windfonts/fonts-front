# fonts-front · 挂到 app.windfonts.com（OSS）时的详情路径
# 字体 API 在 vault.windfonts.com（Next）；api.windfonts.com 为平台网关预留，勿把 Next 进程直接当成 api。
# 详见 docs/DOMAIN-ARCHITECTURE.md
# 验收：/fonts/ibmps → font-detail.html?slug=ibmps；未知 slug → 404.html

location = /fonts {
  return 301 /fonts.html;
}

location ~ ^/fonts/([A-Za-z0-9_-]+)/?$ {
  rewrite ^ /font-detail.html?slug=$1 last;
}

error_page 404 /404.html;
