<!DOCTYPE html>
<html lang="zh-CN">
<head>

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>字体详情 · 文风字体</title>
  <link rel="stylesheet" href="css/wenfeng.css" />
  <link rel="icon" type="image/webp" href="assets/icon.webp" />
</head>
<body class="page-detail">
  <header class="site-chrome">
    <div class="site-chrome-inner">
      <ul class="brush-nav">
        <li class="icon"><a class="brand" href="index.html"><img src="assets/icon.webp" alt="" width="36" height="36" /></a></li>
        <li><a href="index.html">首页</a></li>
        <li><a href="fonts.html">字体库</a></li>
        <li><a href="docs.html">文档</a></li>
      </ul>
      <div class="site-chrome-end">
        <div class="nav-search">
          <input type="search" id="navSearch" placeholder="搜索字体" aria-label="搜索字体" autocomplete="off" />
          <button type="button" class="nav-search-clear" id="navSearchClear" hidden aria-label="清除">×</button>
          <span class="nav-search-icon" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg>
          </span>
        </div>
        <a class="bag-link" href="shopping-bag.html" aria-label="已获取字体">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
            <path d="M6 8h12l-1 12H7L6 8z" /><path d="M9 8a3 3 0 0 1 6 0" />
          </svg>
          <span class="badge" data-pick-count data-count="0">0</span>
        </a>
      </div>
    </div>
  </header>

  <div class="detail-wrap" id="detailRoot">
    <p class="detail-loading" id="detailLoading">正在加载字体…</p>
  </div>

  <a class="affix-bag" href="shopping-bag.html" aria-label="选字袋">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
      <path d="M6 8h12l-1 12H7L6 8z" /><path d="M9 8a3 3 0 0 1 6 0" />
    </svg>
    <span class="badge" data-pick-count data-count="0">0</span>
  </a>

  <footer id="wfExtraFooter" class="site-extra-footer"></footer>

  <script src="js/wf-proto.js"></script>
  <script>
    (function () {
      const root = document.getElementById('detailRoot');
      const id = WFProto.getQuery('id');
      const POEM = '春风又绿江南岸，明月何时照我还。Windfonts 123';
      function esc(s) { return WFProto.escapeHtml(s); }

      function renderMissing() {
        root.innerHTML =
          '<nav class="breadcrumb" aria-label="面包屑"><a href="fonts.html">字体库</a><span class="sep">/</span><span>未找到</span></nav>' +
          '<h1 class="detail-title">未找到该字体</h1>' +
          '<p class="detail-designer">请从 <a href="fonts.html">字体库</a> 选择，或检查 ?id= 是否为目录中的 UUID。</p>';
      }

      function chipsOf(items, hrefKey) {
        return (items || []).map(function (t) {
          return '<a class="chip" href="fonts.html?' + hrefKey + '=' + encodeURIComponent(t) + '">' + esc(t) + '</a>';
        }).join('');
      }

      function kv(rows) {
        const list = (rows || []).filter(function (r) { return r && r[1]; });
        if (!list.length) return '';
        return '<dl class="info-kv">' + list.map(function (r) {
          return '<div><dt>' + esc(r[0]) + '</dt><dd>' + r[1] + '</dd></div>';
        }).join('') + '</dl>';
      }

      function infoCard(title, body) {
        if (!body) return '';
        return '<section class="info-card"><h3>' + esc(title) + '</h3>' + body + '</section>';
      }

      function infoCol(font, designer, weights, tags) {
        const brandRaw = (font.brand && font.brand.name) || font.foundry || designer;
        const brand = String(brandRaw).split(/[;；]/)[0].trim() || brandRaw;
        const brandDescRaw = (font.brand && font.brand.description) || '';
        const brandDesc = (brandDescRaw && !/出品的字体\s*$/.test(brandDescRaw) && brandDescRaw !== brand)
          ? brandDescRaw : '';
        const brandLogo = (font.brand && font.brand.logoUrl) || '';
        const brandAvatar = brandLogo || font.foundryAvatar ||
          (font.brand && font.brand.avatarUrl) || '';
        const brandSite = (font.brand && font.brand.website) || '';
        const brandCount = WFProto.getCatalogList().filter(function (f) {
          const n = String((f.brand && f.brand.name) || f.foundry || '').split(/[;；]/)[0].trim();
          return n && n === brand;
        }).length;
        const licUrl = font.licenseFileUrl || font.licenseUrl || '';
        const mark = brandAvatar
          ? '<img src="' + esc(brandAvatar) + '" alt="" width="64" height="64" loading="lazy" onerror="this.remove()" />'
          : '<span class="brand-mark-letter" aria-hidden="true">' + esc(String(brand || '文').charAt(0)) + '</span>';
        const brandCard =
          '<section class="brand-card">' +
            '<div class="brand-mark">' + mark + '</div>' +
            '<h2 class="brand-name">' + esc(brand) + '</h2>' +
            '<p class="brand-meta">' +
              '<a href="fonts.html?keyword=' + encodeURIComponent(brand) + '">在库 ' + brandCount + ' 款</a>' +
              (brandSite
                ? '<a href="' + esc(brandSite) + '" target="_blank" rel="noopener noreferrer">官网</a>'
                : '') +
            '</p>' +
            (brandDesc ? '<p class="brand-desc">' + esc(brandDesc) + '</p>' : '') +
          '</section>';
        const legalBits = [font.copyright, font.licenseName].filter(Boolean);
        const license =
          '<div class="lic-head">' +
            '<span class="chip">' + esc(font.license || '待核实') + '</span>' +
            (licUrl
              ? '<a class="lic-src" href="' + esc(licUrl) + '" target="_blank" rel="noopener noreferrer">原文</a>'
              : '') +
          '</div>' +
          '<p class="lic-note">' + esc(WFProto.licenseCanDo(font)) + '</p>' +
          (legalBits.length
            ? '<div class="info-box">' + legalBits.map(esc).join('<br>') + '</div>'
            : '');

        const attr = kv([
          ['版本', font.version ? esc(font.version) : ''],
          ['字重', esc(String(weights.length))],
          ['分类', font.category ? esc(font.category) : ''],
          ['格式', 'WOFF2'],
          ['编码', 'Unicode'],
          ['浏览', font.viewCount ? esc(WFProto.formatCount(font.viewCount)) : ''],
          ['字符', font.charCount ? esc(WFProto.formatCount(font.charCount)) : '']
        ]);
        const uses = Array.isArray(font.useCases) ? font.useCases : [];
        const tagHtml = (tags.length || uses.length)
          ? '<div class="chips">' + chipsOf(tags, 'tag') + chipsOf(uses, 'keyword') + '</div>'
          : '';

        return (
          '<aside class="detail-meta" aria-label="字体信息">' +
            brandCard +
            infoCard('授权', license) +
            infoCard('属性', attr) +
            infoCard('标签', tagHtml) +
          '</aside>'
        );
      }

      function previewCard(stack, firstW, weightBtns) {
        return (
          '<section class="stage-card" aria-label="即时预览">' +
            '<div class="stage-well" id="previewArea" contenteditable="true" spellcheck="false" ' +
              'role="textbox" aria-multiline="true" aria-label="即时预览" data-placeholder="输入预览文本" ' +
              'style="font-family:' + esc(stack) + ';font-weight:' + esc(firstW) + ';font-size:64px"></div>' +
            '<div class="stage-bar" id="fn-preview">' +
              '<div class="stage-presets" role="group" aria-label="样句">' +
                '<button type="button" class="preset-mini" data-preset="文风字体，字里行间" data-size="72">标题</button>' +
                '<button type="button" class="preset-mini" data-preset="永远相信，美好的事情即将发生。0123456789" data-size="28">段落</button>' +
                '<button type="button" class="preset-mini" data-preset="WenFeng 文风 Aa 永" data-size="56">品牌</button>' +
                '<button type="button" class="preset-mini is-on" data-preset="' + esc(POEM) + '" data-size="64">诗句</button>' +
              '</div>' +
              '<div class="size-slider">' +
                '<input type="range" id="detailSize" min="16" max="120" value="64" aria-label="字号" />' +
                '<span id="detailSizeVal">64px</span>' +
              '</div>' +
              '<div class="weight-seg" role="tablist" aria-label="字重">' + weightBtns + '</div>' +
              '<div class="stage-swatches">' +
                '<label title="文字色"><input type="color" id="textColor" value="#18181b" aria-label="文字色" /></label>' +
                '<label title="背景色"><input type="color" id="bgColor" value="#ffffff" aria-label="背景色" /></label>' +
                '<button type="button" class="btn btn-save-preview" id="btnSavePreview" title="保存预览为 PNG">保存</button>' +
              '</div>' +
            '</div>' +
          '</section>'
        );
      }

      function embedCard(font) {
        const versions = WFProto.CSS_VERSIONS.map(function (v, i) {
          return '<button type="button" class="preset-mini' + (i === 0 ? ' is-on' : '') +
            '" data-version="' + esc(v.id) + '" title="' + esc(v.hint) + '">' + esc(v.id) + '</button>';
        }).join('');
        return (
          '<section class="use-card" id="fn-embed" aria-label="CSS API">' +
            '<div class="use-well">' +
              '<button type="button" class="btn-copy" id="btnCopyCode">复制</button>' +
              '<pre id="codeConsole"></pre>' +
            '</div>' +
            '<div class="use-bar">' +
              '<div class="stage-presets" role="group" aria-label="字符集">' + versions + '</div>' +
              '<div class="embed-tabs use-tabs" role="tablist">' +
                '<button type="button" class="active" data-tab="link" role="tab">link</button>' +
                '<button type="button" data-tab="import" role="tab">@import</button>' +
                '<button type="button" data-tab="css" role="tab">css</button>' +
                '<button type="button" data-tab="npm" role="tab">npm</button>' +
              '</div>' +
              '<code class="family-code" id="familyCode" title="点击复制 family">' +
                esc(font.family) + '</code>' +
            '</div>' +
          '</section>'
        );
      }

      function relatedBlock(font) {
        const rel = WFProto.relatedFonts(font, 6);
        if (!rel.length) return '';
        rel.forEach(function (f) {
          WFProto.ensureFontCss(f.family, (f.weights && f.weights[0]) || '400');
        });
        return (
          '<section class="related" aria-label="相关字体">' +
            '<' + 'h2>相关字体</h2>' +
            '<div class="related-list">' +
            rel.map(function (f) {
              const st = WFProto.cssFamilyStack(f.family);
              const w = WFProto.weightToCss((f.weights && f.weights[0]) || '400');
              const wCount = (f.weights && f.weights.length) || 1;
              return '<a class="related-card" href="font-detail.html?id=' + encodeURIComponent(f.id) + '">' +
                '<span class="rc-name" style="font-family:' + esc(st) + ';font-weight:' + esc(w) + '">' +
                  esc(f.name) + '</span>' +
                (f.en ? '<span class="rc-en">' + esc(f.en) + '</span>' : '') +
                '<span class="rc-meta">' +
                  '<span class="chip">' + esc(f.license || '待核实') + '</span>' +
                  (f.category ? '<span>' + esc(f.category) + '</span>' : '') +
                  '<span>' + wCount + ' 字重</span>' +
                '</span></a>';
            }).join('') +
            '</div></section>'
        );
      }

      function render(font) {
        document.title = font.name + ' · 文风字体';
        const stack = WFProto.cssFamilyStack(font.family);
        const weights = font.weights && font.weights.length ? font.weights : ['Regular'];
        const tags = font.tags && font.tags.length ? font.tags : [];
        const designer = font.designerShort || font.designer || '—';
        const startLabel = weights.filter(function (w) {
          return String(w).toLowerCase() === 'regular' || WFProto.weightToCss(w) === '400';
        })[0] || weights[0];
        const firstW = WFProto.weightToCss(startLabel);
        weights.forEach(function (w) { WFProto.ensureFontCss(font.family, w); });

        const weightBtns = weights.map(function (w) {
          const cssW = WFProto.weightToCss(w);
          const on = String(w) === String(startLabel);
          return '<button type="button"' + (on ? ' class="active"' : '') +
            ' data-w="' + esc(cssW) + '" data-label="' + esc(w) + '">' + esc(w) + '</button>';
        }).join('');

        const flags = [];
        if (font.category) flags.push('<a class="chip" href="fonts.html?keyword=' + encodeURIComponent(font.category) + '">' + esc(font.category) + '</a>');
        flags.push(chipsOf(tags, 'tag'));
        flags.push('<span class="chip">' + esc(font.license || '待核实') + '</span>');

        root.innerHTML =
          '<nav class="breadcrumb" aria-label="面包屑">' +
            '<a href="fonts.html">字体库</a><span class="sep">/</span><span>' + esc(font.name) + '</span>' +
          '</nav>' +
          '<div class="detail-head">' +
            '<div>' +
              '<h1 class="detail-title" style="font-family:' + esc(stack) + ';font-weight:' + esc(firstW) + '">' + esc(font.name) + '</h1>' +
              (font.en ? '<p class="detail-en">' + esc(font.en) + '</p>' : '') +
              '<div class="detail-flags">' + flags.join('') + '</div>' +
            '</div>' +
            '<div class="detail-actions">' +
              '<a class="btn" href="font-embed.html?id=' + encodeURIComponent(font.id) + '">获取嵌入代码</a>' +
              '<button type="button" class="btn btn-ghost" id="btnCopyCss">复制 CSS</button>' +
              '<button type="button" class="btn btn-black" id="btnJoin" data-join="' + esc(font.id) +
                '" data-name="' + esc(font.name) + '" data-op-detail>添加字体</button>' +
            '</div>' +
          '</div>' +
          '<div class="detail-grid">' +
            '<section class="fn-col" aria-label="功能">' +
              previewCard(stack, firstW, weightBtns) +
              embedCard(font) +
            '</section>' +
            infoCol(font, designer, weights, tags) +
          '</div>' +
          relatedBlock(font);

        wireActions(font, stack, firstW, weights);
      }

      function flashBtn(btn, okText) {
        if (!btn) return;
        const old = btn.textContent;
        btn.textContent = okText || '已复制';
        btn.classList.add('is-copied');
        setTimeout(function () {
          btn.textContent = old;
          btn.classList.remove('is-copied');
        }, 1200);
      }

      function wireActions(font, stack, firstW, weights) {
        const pane = document.getElementById('previewArea');
        const size = document.getElementById('detailSize');
        const sizeVal = document.getElementById('detailSizeVal');
        const textColor = document.getElementById('textColor');
        const bgColor = document.getElementById('bgColor');
        let currentWeight = firstW;
        let currentVersion = 'full';
        let currentTab = 'link';

        const stored = WFProto.getSample();
        const startText = (!stored || stored === '文风字体') ? POEM : stored;
        pane.textContent = startText;
        size.value = '64';
        sizeVal.textContent = '64px';
        pane.style.fontSize = '64px';
        pane.style.fontWeight = firstW;

        function applySize(px) {
          size.value = String(px);
          sizeVal.textContent = px + 'px';
          pane.style.fontSize = px + 'px';
        }
        function paneText() {
          return (pane.innerText || '').replace(/\n+$/, '');
        }

        function currentUrl(ver) {
          return WFProto.cssUrl(font.family, currentWeight, ver || currentVersion);
        }
        function npmName() {
          const raw = font.normalized || font.family || 'Font';
          return String(raw).split('-').map(function (w) {
            return w.charAt(0).toUpperCase() + w.slice(1);
          }).join('-');
        }
        function weightLabel() {
          const active = document.querySelector('.weight-seg button.active');
          return (active && active.dataset.label) || (weights[0] || 'Regular');
        }
        function snippetFor(tab) {
          const url = currentUrl();
          if (tab === 'import') return "@import url('" + url + "');";
          if (tab === 'css') {
            return '.wf-sample {\n  font-family: ' + stack + ';\n  font-weight: ' + currentWeight + ';\n  font-style: normal;\n}';
          }
          if (tab === 'npm') {
            return 'npm install @windfonts/chinese-fonts\n\nimport { loadFont } from \'@windfonts/chinese-fonts\';\n\nloadFont(\'' +
              npmName() + '-' + weightLabel() + '\', { subset: \'' + currentVersion + '\' });';
          }
          return '<link rel="stylesheet" href="' + url + '" />';
        }
        function syncUse() {
          const input = document.getElementById('cssLinkInput');
          if (input) input.value = currentUrl();
          const pre = document.getElementById('codeConsole');
          if (pre) pre.textContent = snippetFor(currentTab);
        }

        pane.addEventListener('input', function () {
          document.querySelectorAll('[data-preset]').forEach(function (b) { b.classList.remove('is-on'); });
          WFProto.setSample(paneText());
        });
        pane.addEventListener('paste', function (e) {
          e.preventDefault();
          const clip = (e.clipboardData || window.clipboardData);
          const plain = clip ? clip.getData('text/plain') : '';
          document.execCommand('insertText', false, plain);
        });
        pane.addEventListener('keydown', function (e) {
          if (e.key === 'Enter') {
            e.preventDefault();
            document.execCommand('insertLineBreak');
          }
        });
        document.querySelectorAll('[data-preset]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            document.querySelectorAll('[data-preset]').forEach(function (b) {
              b.classList.toggle('is-on', b === btn);
            });
            const v = btn.getAttribute('data-preset') || '';
            const px = parseInt(btn.getAttribute('data-size') || size.value, 10);
            pane.textContent = v;
            WFProto.setSample(v);
            if (px) applySize(px);
            pane.focus();
          });
        });
        size.addEventListener('input', function () { applySize(size.value); });
        textColor.addEventListener('input', function () { pane.style.color = textColor.value; });
        bgColor.addEventListener('input', function () { pane.style.backgroundColor = bgColor.value; });

        document.querySelectorAll('.weight-seg button').forEach(function (btn) {
          btn.addEventListener('click', function () {
            document.querySelectorAll('.weight-seg button').forEach(function (b) { b.classList.remove('active'); });
            btn.classList.add('active');
            currentWeight = btn.dataset.w;
            pane.style.fontWeight = currentWeight;
            WFProto.ensureFontCss(font.family, currentWeight);
            syncUse();
          });
        });
        document.querySelectorAll('#fn-embed [data-version]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            document.querySelectorAll('#fn-embed [data-version]').forEach(function (b) {
              b.classList.toggle('is-on', b === btn);
            });
            currentVersion = btn.getAttribute('data-version') || 'full';
            syncUse();
          });
        });
        document.querySelectorAll('#fn-embed .use-tabs button').forEach(function (btn) {
          btn.addEventListener('click', function () {
            currentTab = btn.getAttribute('data-tab') || 'link';
            document.querySelectorAll('#fn-embed .use-tabs button').forEach(function (b) {
              b.classList.toggle('active', b === btn);
            });
            syncUse();
          });
        });

        const join = document.getElementById('btnJoin');
        if (join) {
          join.addEventListener('click', function (e) {
            e.preventDefault();
            WFProto.togglePick(font.id, font.name);
          });
          WFProto.syncJoinButtons();
        }
        function copyNow(textVal, btn) {
          WFProto.copyText(textVal).then(function () { flashBtn(btn); }).catch(function () {
            if (btn) btn.textContent = '失败';
          });
        }
        const btnCopyCss = document.getElementById('btnCopyCss');
        if (btnCopyCss) btnCopyCss.addEventListener('click', function () { copyNow(currentUrl(), btnCopyCss); });
        const btnCopyLink = document.getElementById('btnCopyLink');
        if (btnCopyLink) btnCopyLink.addEventListener('click', function () { copyNow(currentUrl(), btnCopyLink); });
        const btnCopyCode = document.getElementById('btnCopyCode');
        if (btnCopyCode) {
          btnCopyCode.addEventListener('click', function () {
            const pre = document.getElementById('codeConsole');
            copyNow(pre ? pre.textContent : '', btnCopyCode);
          });
        }
        const familyCode = document.getElementById('familyCode');
        if (familyCode) familyCode.addEventListener('click', function () { copyNow(font.family, familyCode); });

        document.getElementById('btnSavePreview').addEventListener('click', function () {
          const w = Math.max(pane.clientWidth, 640);
          const h = Math.max(pane.clientHeight, 320);
          const canvas = document.createElement('canvas');
          const scale = 2;
          canvas.width = w * scale;
          canvas.height = h * scale;
          const ctx = canvas.getContext('2d');
          ctx.scale(scale, scale);
          ctx.fillStyle = bgColor.value || '#ffffff';
          ctx.fillRect(0, 0, w, h);
          ctx.fillStyle = textColor.value || '#18181b';
          ctx.font = (pane.style.fontWeight || '400') + ' ' + (size.value || 44) + 'px ' + stack;
          ctx.textBaseline = 'middle';
          const lines = (paneText() || '文').split('\n');
          const lh = parseFloat(size.value) * 1.28;
          const startY = h / 2 - ((lines.length - 1) * lh) / 2;
          lines.forEach(function (line, i) { ctx.fillText(line, 40, startY + i * lh); });
          const a = document.createElement('a');
          a.download = (font.normalized || font.family || 'wenfeng') + '-preview.png';
          a.href = canvas.toDataURL('image/png');
          a.click();
        });

        syncUse();
      }

      WFProto.loadCatalog().then(function () {
        if (!id) {
          const list = WFProto.getCatalogList();
          if (list.length) {
            history.replaceState(null, '', 'font-detail.html?id=' + encodeURIComponent(list[0].id));
            render(list[0]);
          } else {
            renderMissing();
          }
          return;
        }
        const font = WFProto.getFont(id);
        if (!font) renderMissing();
        else render(font);
      });
    })();
  </script>
</body>
</html>
