<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <script>try{if(localStorage.getItem("wf-theme")==="dark")document.documentElement.setAttribute("data-theme","dark");if(localStorage.getItem("wf-scale")==="lg")document.documentElement.setAttribute("data-scale","lg");if(localStorage.getItem("wf-view")==="dev")document.documentElement.setAttribute("data-view","dev")}catch(e){}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>登录 · 文风字体</title>
  <link rel="stylesheet" href="css/fonts.css?v=20260925r" />
  <link rel="stylesheet" href="css/tokens.css?v=20260925r" />
  <link rel="stylesheet" href="css/base.css?v=20260925r" />
  <link rel="stylesheet" href="css/components.css?v=20260925r" />
  <link rel="stylesheet" href="css/site.css?v=20260925r" />
  <link rel="icon" type="image/webp" href="assets/icon.webp" />
</head>
<body class="page-login">
  <header data-topbar></header>

  <main class="container login">
    <form id="authForm">
      <div>
        <h1 id="authTitle">登录控制台</h1>
        <p class="sub" id="authSub">使用字体后端会话管理项目发布与 API 密钥。顾客统一账号将由 windfonts.com 承接。</p>
      </div>
      <p class="t-13" id="authError" hidden style="color:var(--danger, #b42318);margin:0"></p>
      <div class="field" id="nameField" hidden>
        <label for="displayName">显示名</label>
        <input class="input" id="displayName" autocomplete="nickname" placeholder="怎么称呼你" />
      </div>
      <div class="field"><label for="account">账号</label><input class="input" id="account" type="text" autocomplete="username" placeholder="用户名" required autofocus /></div>
      <div class="field"><label for="password">密码</label><input class="input" id="password" type="password" autocomplete="current-password" placeholder="••••••••" required /></div>
      <div class="field" id="confirmField" hidden>
        <label for="confirm">确认密码</label>
        <input class="input" id="confirm" type="password" autocomplete="new-password" placeholder="再输入一次" />
      </div>
      <button type="submit" class="btn btn-ink btn-lg" id="authBtn"><svg class="icon" aria-hidden="true"><use href="assets/icons.svg?v=20260925r#i-user"/></svg>登录</button>
      <div id="ssoSlot" hidden style="margin-top:var(--s-4)">
        <p class="t-13 muted" style="margin:0 0 var(--s-3);text-align:center">或</p>
        <button type="button" class="btn btn-lg" id="ssoBtn" style="width:100%">用站点账号登录</button>
      </div>
      <p class="alt" id="authAlt"></p>
    </form>
  </main>

  <footer id="wfExtraFooter"></footer>
  <script src="js/wf-proto.js?v=20260926oflopen"></script>
  <script src="js/wf-chrome.js?v=20260926brandinvite"></script>
  <script src="js/wf-auth.js?v=20260926sso2"></script>
  <script src="js/wf-app.js?v=20260926sso2"></script>
  <script>
    (function () {
      const signup = WFProto.getQuery('mode') === 'signup';
      const q = new URLSearchParams(location.search);
      const errEl = document.getElementById('authError');
      const btn = document.getElementById('authBtn');
      const ssoSlot = document.getElementById('ssoSlot');
      const ssoBtn = document.getElementById('ssoBtn');

      function dest() {
        const next = WFProto.getQuery('next');
        if (next === 'bag') return 'app/subset.html?from=bag';
        if (next === 'app' && /^[\w-]+\.html$/.test(WFProto.getQuery('back'))) {
          const back = WFProto.getQuery('back');
          const cert = WFProto.getQuery('cert');
          if (back === 'cert-upload.html' && cert) {
            return 'app/cert-upload.html?cert=' + encodeURIComponent(cert);
          }
          return 'app/' + back;
        }
        if (next === 'cert') {
          const cert = WFProto.getQuery('cert');
          return 'app/cert-upload.html' + (cert ? '?cert=' + encodeURIComponent(cert) : '');
        }
        if (next === 'certs') return 'app/certs.html';
        if (next === 'claim') {
          const slug = WFProto.getQuery('slug');
          return 'claim.html' + (slug ? '?slug=' + encodeURIComponent(slug) : '');
        }
        return 'app/index.html';
      }

      function hrefFor(mode) {
        const next = new URLSearchParams(q);
        if (mode === 'signup') next.set('mode', 'signup');
        else next.delete('mode');
        const s = next.toString();
        return 'login.html' + (s ? '?' + s : '');
      }

      function showError(msg) {
        if (!msg) { errEl.hidden = true; errEl.textContent = ''; return; }
        errEl.hidden = false;
        errEl.textContent = msg;
      }

      function setBusy(on) {
        btn.disabled = !!on;
        btn.setAttribute('aria-busy', on ? 'true' : 'false');
        if (ssoBtn) ssoBtn.disabled = !!on;
      }

      /* Auth.js 失败回跳 ?error=CredentialsSignin / OAuthCallback */
      (function () {
        const e = WFProto.getQuery('error');
        if (!e) return;
        if (/CredentialsSignin|credentials/i.test(e)) showError('账号或密码错误');
        else if (/MissingCSRF/i.test(e)) showError('登录令牌失效，请重试');
        else if (/OAuth|Callback|AccessDenied/i.test(e)) showError('站点账号登录失败（' + e + '）');
        else showError('登录失败（' + e + '）');
      })();

      if (signup) {
        document.title = '注册 · 文风字体';
        document.getElementById('authTitle').textContent = '注册控制台';
        document.getElementById('authSub').textContent = '顾客账号由 windfonts.com 统一注册；字体后端会话暂不开放自助开户。';
        document.getElementById('nameField').hidden = true;
        document.getElementById('confirmField').hidden = true;
        document.getElementById('account').required = false;
        document.getElementById('password').required = false;
        document.getElementById('authForm').querySelectorAll('.field').forEach(function (el) {
          if (el.id !== 'nameField' && el.id !== 'confirmField') el.hidden = true;
        });
        if (ssoSlot) ssoSlot.hidden = true;
        btn.innerHTML = WFChrome.icon('user-add') + '去 windfonts.com 注册';
        btn.type = 'button';
        btn.addEventListener('click', function () {
          location.href = 'https://windfonts.com/';
        });
        document.getElementById('authAlt').innerHTML = '已有后端账号？<a href="' + hrefFor('login') + '">登录控制台</a>';
      } else {
        document.getElementById('authAlt').innerHTML = '还没有站点账号？<a href="https://windfonts.com/">先到 windfonts.com</a>' +
          ' · <a href="' + hrefFor('signup') + '">说明</a>' +
          '<span data-pricing hidden> · <a href="pricing.html">查看定价</a></span>';
      }

      if (!signup) {
        document.getElementById('authForm').addEventListener('submit', function (e) {
          e.preventDefault();
          showError('');
          setBusy(true);
          const account = document.getElementById('account').value;
          const password = document.getElementById('password').value;
          WFAuth.signIn(account, password).then(function (r) {
            if (!r.ok) { setBusy(false); showError(r.error || '登录失败'); return; }
            const go = function () { location.href = dest(); };
            if (window.WFApp && WFApp.load) {
              WFApp.load().then(go).catch(go);
            } else if (WFAuth.ensureConsoleKey) {
              WFAuth.ensureConsoleKey().then(go).catch(go);
            } else {
              go();
            }
          }).catch(function (err) {
            setBusy(false);
            showError((err && err.message) || '登录失败');
          });
        });

        /* 顾客 SSO：vault 配置 WEIXIAODUO_OAUTH_* 后 providers 会出现 weixiaoduo */
        WFAuth.listProviders().then(function (providers) {
          if (!providers || !providers.weixiaoduo) return;
          ssoSlot.hidden = false;
          const label = (providers.weixiaoduo.name || '站点账号');
          ssoBtn.textContent = '用' + label + '登录';
          ssoBtn.addEventListener('click', function () {
            showError('');
            setBusy(true);
            WFAuth.signInOAuth('weixiaoduo', location.origin + '/' + dest()).catch(function (err) {
              setBusy(false);
              showError((err && err.message) || '无法开始站点登录');
            });
          });
        });
      }

      /* 有 vault 会话则进控制台；生产不认纯 localStorage 假壳 */
      WFAuth.syncFromVault().then(function (profile) {
        if (profile) { location.replace(dest()); return; }
        if (WFAuth.requiresVaultSession && WFAuth.requiresVaultSession()) {
          if (WFAuth.clearOrphanLocalUser) WFAuth.clearOrphanLocalUser();
          return;
        }
        if (WFChrome.user()) location.replace(dest());
      }).catch(function () {
        if (WFChrome.user() && WFChrome.user().source === 'vault-nextauth') {
          WFChrome.logout();
        } else if (!(WFAuth.requiresVaultSession && WFAuth.requiresVaultSession()) && WFChrome.user()) {
          location.replace(dest());
        } else if (WFAuth.clearOrphanLocalUser) {
          WFAuth.clearOrphanLocalUser();
        }
      });
    })();
  </script>
</body>
</html>
