<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <script>try{if(localStorage.getItem("wf-theme")==="dark")document.documentElement.setAttribute("data-theme","dark");if(localStorage.getItem("wf-scale")==="lg")document.documentElement.setAttribute("data-scale","lg");if(localStorage.getItem("wf-view")==="dev")document.documentElement.setAttribute("data-view","dev")}catch(e){}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>登录 · 文风字体</title>
  <link rel="preconnect" href="https://cn.windfonts.com" crossorigin />
  <link rel="dns-prefetch" href="https://cn.windfonts.com" />
  <link rel="preload" as="font" type="font/woff2" crossorigin href="https://cn.windfonts.com/fonts-packages/Albbpht/Regular/zh-common/2.woff2" />
  <link rel="preload" as="font" type="font/woff2" crossorigin href="https://cn.windfonts.com/fonts-packages/Hckht/Medium/full/16.woff2" />
  <link rel="preload" as="font" type="font/woff2" crossorigin href="https://cn.windfonts.com/fonts-packages/Hckht/Medium/full/18.woff2" />
  <link rel="preload" as="font" type="font/woff2" crossorigin href="https://cn.windfonts.com/fonts-packages/Hckht/Medium/full/15.woff2" />
  <link rel="preload" as="font" type="font/woff2" crossorigin href="https://cn.windfonts.com/fonts-packages/Hckht/Medium/full/19.woff2" />
  <link rel="stylesheet" href="css/fonts.css?v=20260927perf3" media="print" onload="this.media='all'" />
  <noscript><link rel="stylesheet" href="css/fonts.css?v=20260927perf3" /></noscript>
  <link rel="stylesheet" href="css/tokens.css?v=20260927perf3" />
  <link rel="stylesheet" href="css/base.css?v=20260927perf3" />
  <link rel="stylesheet" href="css/components.css?v=20260927perf3" />
  <link rel="stylesheet" href="css/site.css?v=20260927perf3" />
  <link rel="icon" type="image/webp" href="assets/icon.webp" />
</head>
<body class="page-login">
  <header data-topbar></header>

  <main class="container login">
    <form id="authForm">
      <div>
        <h1 id="authTitle">登录控制台</h1>
        <p class="sub" id="authSub">管理项目、域名白名单、子集化与用量。</p>
      </div>
      <div class="field" id="nameField" hidden>
        <label for="displayName">显示名</label>
        <input class="input" id="displayName" autocomplete="nickname" placeholder="怎么称呼你" />
      </div>
      <div class="field"><label for="email">邮箱</label><input class="input" id="email" type="email" autocomplete="email" placeholder="you@example.com" required autofocus /></div>
      <div class="field"><label for="password">密码</label><input class="input" id="password" type="password" autocomplete="current-password" placeholder="••••••••" required /></div>
      <div class="field" id="confirmField" hidden>
        <label for="confirm">确认密码</label>
        <input class="input" id="confirm" type="password" autocomplete="new-password" placeholder="再输入一次" />
      </div>
      <button type="submit" class="btn btn-ink btn-lg" id="authBtn"><svg class="icon" aria-hidden="true"><use href="assets/icons.svg?v=20260925r#i-user"/></svg>登录</button>
      <p class="alt" id="authAlt"></p>
    </form>
  </main>

  <footer id="wfExtraFooter"></footer>
  <script defer src="js/wf-proto.js?v=20260927perf3"></script>
  <script defer src="js/wf-chrome.js?v=20260927perf3"></script>
  <script>
    (function () {
      const signup = WFProto.getQuery('mode') === 'signup';
      const q = new URLSearchParams(location.search);

      function dest() {
        const next = WFProto.getQuery('next');
        if (next === 'bag') return 'app/subset.html?from=bag';
        if (next === 'app' && /^[\w-]+\.html$/.test(WFProto.getQuery('back'))) return 'app/' + WFProto.getQuery('back');
        if (next === 'claim') {
          const slug = WFProto.getQuery('slug');
          return 'claim.html' + (slug ? '?slug=' + encodeURIComponent(slug) : '');
        }
        return 'app/index.html';
      }

      function hrefFor(mode) {
        const next = new URLSearchParams(q);
        if (mode === 'signup') next.set('mode', 'signup');
        else next.delete('mode');
        const s = next.toString();
        return 'login.html' + (s ? '?' + s : '');
      }

      function enter() {
        const email = document.getElementById('email').value || 'design@wenpai.org';
        const name = (document.getElementById('displayName').value || '').trim() || email.split('@')[0];
        WFChrome.login({ name: name, email: email, role: 'user' });
        location.href = dest();
      }

      if (signup) {
        document.title = '注册 · 文风字体';
        document.getElementById('authTitle').textContent = '注册控制台';
        document.getElementById('authSub').textContent = '创建账号后可管理项目、上传字体、认领厂商页。';
        document.getElementById('nameField').hidden = false;
        document.getElementById('confirmField').hidden = false;
        document.getElementById('confirm').required = true;
        document.getElementById('password').autocomplete = 'new-password';
        document.getElementById('authBtn').innerHTML = WFChrome.icon('user-add') + '创建账号';
        document.getElementById('authAlt').innerHTML = '已有账号？<a href="' + hrefFor('login') + '">登录</a>';
      } else {
        document.getElementById('authAlt').innerHTML = '还没有账号？<a href="' + hrefFor('signup') + '">免费注册</a>' +
          '<span data-pricing hidden> · <a href="pricing.html">查看定价</a></span>';
      }

      document.getElementById('authForm').addEventListener('submit', function (e) {
        e.preventDefault();
        if (signup) {
          const a = document.getElementById('password').value;
          const b = document.getElementById('confirm').value;
          if (a !== b) { WFChrome.toast('两次密码不一致'); return; }
        }
        enter();
      });

      if (WFChrome.user()) location.replace(dest());
    })();
  </script>
</body>
</html>
