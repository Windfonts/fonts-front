<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>字体详情 · 文风字库</title>
  <link rel="stylesheet" href="css/vault-target.css" />
</head>
<body class="page-detail">
  <header class="vt-header">
    <div class="vt-header-inner">
      <a class="vt-brand" href="index.html">
        <span class="vt-brand-mark" aria-hidden="true">文</span>
        <span>文风字库</span>
      </a>
      <nav class="vt-nav" aria-label="主导航">
        <a href="index.html">首页</a>
        <a href="fonts.html">字体列表</a>
        <a href="picks.html">我的选字</a>
      </nav>
      <div class="vt-header-end">
        <div class="vt-nav-search">
          <input type="search" id="navSearch" placeholder="搜索字体…" aria-label="搜索字体" autocomplete="off" />
          <span class="icon" aria-hidden="true">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg>
          </span>
        </div>
        <a class="vt-picks-btn" href="picks.html" title="我的选字">
          选字
          <span class="badge" data-pick-count data-count="0">0</span>
        </a>
      </div>
    </div>
  </header>

  <main class="vt-main">
    <div class="vt-container" id="detailRoot">
      <p class="font-list-empty">正在加载…</p>
    </div>
  </main>

  <footer class="vt-footer">
    <strong>vault 目标态线框 · 参照 next 行为 · 非生产</strong>
    <div style="margin-top:0.35rem">P0-3 详情舞台优先 · 复制 CSS · 诚实许可块 · 加入选字</div>
  </footer>

  <script src="js/vault-target.js"></script>
  <script>
    (function () {
      const root = document.getElementById('detailRoot');
      const VT = window.VaultTarget;

      function renderMissing() {
        root.innerHTML =
          '<nav class="breadcrumb" aria-label="面包屑">' +
            '<a href="index.html">首页</a><span class="sep">/</span>' +
            '<a href="fonts.html">字体列表</a><span class="sep">/</span>' +
            '<span>未找到</span></nav>' +
          '<h1 class="detail-title">未找到该字体</h1>' +
          '<p class="detail-en">请从 <a href="fonts.html">字体列表</a> 选择，或检查 ?id=。</p>';
      }

      function render(font) {
        document.title = font.name + ' · 文风字库';
        const stack = VT.cssFamilyStack(font.family);
        const weights = font.weights && font.weights.length ? font.weights : ['Regular'];
        const firstW = VT.weightToCss(weights[0]);
        weights.forEach(function (w) { VT.ensureFontCss(font.family, w); });

        const cssLink = VT.cssUrl(font.family, firstW);
        const cssSnippet =
          '<!-- 文风字库 CSS API -->\n' +
          '<link rel="stylesheet" href="' + cssLink + '" />\n\n' +
          '/* 使用 */\n' +
          '.hero {\n' +
          '  font-family: ' + stack + ';\n' +
          '  font-weight: ' + firstW + ';\n' +
          '}';

        const weightBtns = weights.map(function (w, i) {
          return '<button type="button"' + (i === 0 ? ' class="active"' : '') +
            ' data-w="' + VT.escapeHtml(VT.weightToCss(w)) + '">' +
            VT.escapeHtml(w) + '</button>';
        }).join('');

        const tags = (font.tags || []).map(function (t) {
          return '<a class="chip" href="fonts.html?tag=' + encodeURIComponent(t) + '">' +
            VT.escapeHtml(t) + '</a>';
        }).join('');

        const tierMeta = VT.TIER_META[font.license_tier] || VT.TIER_META.unv;
        const spdx = font.license_spdx ? '<code>' + VT.escapeHtml(font.license_spdx) + '</code>' : '—';

        root.innerHTML =
          '<nav class="breadcrumb" aria-label="面包屑">' +
            '<a href="index.html">首页</a><span class="sep">/</span>' +
            '<a href="fonts.html">字体列表</a><span class="sep">/</span>' +
            '<span>' + VT.escapeHtml(font.name) + '</span>' +
          '</nav>' +
          '<h1 class="detail-title">' + VT.escapeHtml(font.name) + '</h1>' +
          '<p class="detail-en">' + VT.escapeHtml(font.en || font.family) + '</p>' +
          '<div class="detail-meta-row">' +
            '<span>设计师 · ' + VT.escapeHtml(font.designerShort || '—') + '</span>' +
            '<span>family <code>' + VT.escapeHtml(font.family) + '</code></span>' +
            VT.tierHtml(font.license_tier, { compact: true }) +
            '<span class="chips">' + tags + '</span>' +
          '</div>' +

          '<section class="detail-stage" aria-label="预览舞台">' +
            '<div class="detail-stage-controls">' +
              '<div class="weight-seg" role="tablist" aria-label="字重">' + weightBtns + '</div>' +
              '<div class="size-slider">' +
                '<span>字号</span>' +
                '<input type="range" id="detailSize" min="12" max="108" value="56" aria-label="字号" />' +
                '<span class="size-val" id="detailSizeVal">56px</span>' +
              '</div>' +
              '<input type="text" class="preview-input" id="detailText" aria-label="预览文字" />' +
            '</div>' +
            '<div class="detail-stage-pane" id="previewPane" style="font-family:' +
              VT.escapeHtml(stack) + ';font-weight:' + VT.escapeHtml(firstW) + '"></div>' +
          '</section>' +

          '<div class="detail-actions">' +
            '<button type="button" class="btn btn-black" id="btnCopyCss">复制 CSS</button>' +
            '<button type="button" class="btn" id="btnJoin" data-join="' + VT.escapeHtml(font.id) +
              '" data-name="' + VT.escapeHtml(font.name) + '" data-op-detail>加入选字</button>' +
            '<a class="btn btn-ghost" href="fonts.html">← 返回列表</a>' +
          '</div>' +

          '<div class="detail-grid">' +
            '<div class="css-block">' +
              '<h3>嵌入 · CSS API</h3>' +
              '<pre id="cssPre">' + VT.escapeHtml(cssSnippet) + '</pre>' +
              '<p style="margin:0;font-size:0.75rem;color:var(--vt-zinc-500)">' +
                '通过 CSS 加载（非 OSS 直链下载）。API：' +
                '<code style="word-break:break-all">' + VT.escapeHtml(cssLink) + '</code>' +
              '</p>' +
            '</div>' +
            '<aside class="detail-aside">' +
              '<h3>许可（诚实档位）</h3>' +
              VT.tierHtml(font.license_tier) +
              '<p style="margin-top:0.75rem">SPDX · ' + spdx + '</p>' +
              '<p>来源字段 · ' + VT.escapeHtml(font.license || '—') + '</p>' +
              '<h3>分类</h3><p>' + VT.escapeHtml(font.category || '—') + '</p>' +
              '<h3>简介</h3><p class="desc">' + VT.escapeHtml(font.description || '暂无描述') + '</p>' +
            '</aside>' +
          '</div>';

        wire(font, stack, firstW, cssSnippet);
      }

      function wire(font, stack, firstW, cssSnippet) {
        const pane = document.getElementById('previewPane');
        const text = document.getElementById('detailText');
        const size = document.getElementById('detailSize');
        const sizeVal = document.getElementById('detailSizeVal');
        text.value = VT.getSample();
        pane.textContent = text.value;
        const initSize = Math.max(VT.getSize(), 56);
        size.value = String(initSize);
        sizeVal.textContent = initSize + 'px';
        pane.style.fontSize = initSize + 'px';

        text.addEventListener('input', function () {
          pane.textContent = text.value || '文';
          VT.setSample(text.value);
        });
        size.addEventListener('input', function () {
          pane.style.fontSize = size.value + 'px';
          sizeVal.textContent = size.value + 'px';
          VT.setSize(size.value);
        });
        document.querySelectorAll('.weight-seg button').forEach(function (btn) {
          btn.addEventListener('click', function () {
            document.querySelectorAll('.weight-seg button').forEach(function (b) {
              b.classList.remove('active');
            });
            btn.classList.add('active');
            pane.style.fontWeight = btn.dataset.w;
            VT.ensureFontCss(font.family, btn.dataset.w);
            const link = VT.cssUrl(font.family, btn.dataset.w);
            const snip =
              '<!-- 文风字库 CSS API -->\n' +
              '<link rel="stylesheet" href="' + link + '" />\n\n' +
              '/* 使用 */\n' +
              '.hero {\n' +
              '  font-family: ' + stack + ';\n' +
              '  font-weight: ' + btn.dataset.w + ';\n' +
              '}';
            document.getElementById('cssPre').textContent = snip;
            document.getElementById('btnCopyCss')._snip = snip;
          });
        });

        const copyBtn = document.getElementById('btnCopyCss');
        copyBtn._snip = cssSnippet;
        copyBtn.addEventListener('click', function () {
          VT.copyText(copyBtn._snip || cssSnippet);
        });

        const join = document.getElementById('btnJoin');
        join.addEventListener('click', function (e) {
          e.preventDefault();
          VT.togglePick(font.id, font.name);
        });
        VT.syncJoinButtons();
      }

      VT.loadCatalog().then(function () {
        const id = VT.getQuery('id');
        if (!id) {
          const list = VT.getCatalog();
          if (list.length) {
            history.replaceState(null, '', 'font-detail.html?id=' + encodeURIComponent(list[0].id));
            render(list[0]);
          } else {
            renderMissing();
          }
          return;
        }
        const font = VT.getFont(id);
        if (!font) renderMissing();
        else render(font);
      });
    })();
  </script>
</body>
</html>
