<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>字体列表 · 文风字库</title>
  <link rel="stylesheet" href="css/vault-target.css" />
</head>
<body class="page-fonts">
  <header class="vt-header">
    <div class="vt-header-inner">
      <a class="vt-brand" href="index.html">
        <span class="vt-brand-mark" aria-hidden="true">文</span>
        <span>文风字库</span>
      </a>
      <nav class="vt-nav" aria-label="主导航">
        <a href="index.html">首页</a>
        <a class="active" href="fonts.html">字体列表</a>
        <a href="picks.html">我的选字</a>
      </nav>
      <div class="vt-header-end">
        <div class="vt-nav-search">
          <input type="search" id="navSearch" placeholder="搜索字体…" aria-label="搜索字体" autocomplete="off" />
          <span class="icon" aria-hidden="true">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg>
          </span>
        </div>
        <a class="vt-picks-btn" href="picks.html" title="我的选字">
          选字
          <span class="badge" data-pick-count data-count="0">0</span>
        </a>
      </div>
    </div>
  </header>

  <div class="specimen-bar" id="specimenBar">
    <div class="specimen-bar-inner">
      <input type="text" class="preview-input" id="specimenText" placeholder="输入文字，即时预览整表" aria-label="共用样句" />
      <div class="size-slider">
        <span>12</span>
        <input type="range" id="specimenSize" min="12" max="108" value="48" aria-label="字号" />
        <span>108</span>
        <span class="size-val" data-size-val>48px</span>
      </div>
    </div>
  </div>

  <main class="vt-main">
    <div class="vt-container">
      <div class="fonts-toolbar">
        <div class="chips" role="navigation" aria-label="分类筛选">
          <a class="chip" href="fonts.html" data-tag="">全部</a>
          <a class="chip" href="fonts.html?tag=黑体" data-tag="黑体">黑体</a>
          <a class="chip" href="fonts.html?tag=宋体" data-tag="宋体">宋体</a>
          <a class="chip" href="fonts.html?tag=楷体" data-tag="楷体">楷体</a>
          <a class="chip" href="fonts.html?tag=隶书" data-tag="隶书">隶书</a>
          <a class="chip" href="fonts.html?tag=硬笔手写" data-tag="硬笔手写">硬笔手写</a>
          <a class="chip" href="fonts.html?tag=毛笔书法" data-tag="毛笔书法">毛笔书法</a>
          <a class="chip" href="fonts.html?tag=卡通创意" data-tag="卡通创意">卡通创意</a>
          <a class="chip" href="fonts.html?tag=拼音" data-tag="拼音">拼音</a>
        </div>
        <p class="fonts-count" id="fontsCountLabel">加载中…</p>
      </div>

      <ul class="font-list" id="fontList">
        <li class="font-list-empty">正在加载字体目录…</li>
      </ul>

      <div class="list-more-wrap">
        <button type="button" class="btn" id="loadMore" hidden>加载更多</button>
      </div>
    </div>
  </main>

  <footer class="vt-footer">
    <strong>vault 目标态线框 · 参照 next 行为 · 非生产</strong>
    <div style="margin-top:0.35rem">P0-1 字帖行 + sticky 样句/字号 · P0-2 加入选字 · P0-4 search= · P0-5 档位点</div>
  </footer>

  <script src="js/vault-target.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      VaultTarget.mountFontsList({ pageSize: 12 });
    });
  </script>
</body>
</html>
