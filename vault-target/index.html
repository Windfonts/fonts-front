<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>文风字库 · vault 目标态</title>
  <link rel="stylesheet" href="css/vault-target.css" />
</head>
<body class="page-home">
  <header class="vt-header">
    <div class="vt-header-inner">
      <a class="vt-brand" href="index.html">
        <span class="vt-brand-mark" aria-hidden="true">文</span>
        <span>文风字库</span>
      </a>
      <nav class="vt-nav" aria-label="主导航">
        <a class="active" href="index.html">首页</a>
        <a href="fonts.html">字体列表</a>
        <a href="picks.html">我的选字</a>
      </nav>
      <div class="vt-header-end">
        <div class="vt-nav-search">
          <input type="search" id="navSearch" placeholder="搜索字体…" aria-label="搜索字体" autocomplete="off" />
          <span class="icon" aria-hidden="true">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg>
          </span>
        </div>
        <a class="vt-picks-btn" href="picks.html" title="我的选字">
          选字
          <span class="badge" data-pick-count data-count="0">0</span>
        </a>
      </div>
    </div>
  </header>

  <main class="vt-main">
    <div class="vt-container">
      <section class="home-hero">
        <p class="home-brand-line">文风字库 · 在线字体 CDN</p>
        <form class="home-search" action="fonts.html" method="get" role="search">
          <input type="search" name="search" placeholder="搜索字体，例如：思源、霞鹜、手写…" aria-label="搜索字体" />
          <button type="submit" class="btn btn-black">搜索</button>
        </form>
        <div class="home-cats chips" role="navigation" aria-label="分类">
          <a class="chip" href="fonts.html?tag=黑体">黑体</a>
          <a class="chip" href="fonts.html?tag=宋体">宋体</a>
          <a class="chip" href="fonts.html?tag=楷体">楷体</a>
          <a class="chip" href="fonts.html?tag=隶书">隶书</a>
          <a class="chip" href="fonts.html?tag=硬笔手写">硬笔手写</a>
          <a class="chip" href="fonts.html?tag=毛笔书法">毛笔书法</a>
          <a class="chip" href="fonts.html?tag=卡通创意">卡通创意</a>
          <a class="chip" href="fonts.html?tag=拼音">拼音</a>
        </div>
      </section>

      <div class="home-section-head">
        <h2>精选字帖</h2>
        <a href="fonts.html">全部字体 →</a>
      </div>
      <ul class="featured-list" id="featuredList">
        <li class="font-list-empty" style="list-style:none;border:none">加载精选…</li>
      </ul>
    </div>
  </main>

  <footer class="vt-footer">
    <strong>vault 目标态线框 · 参照 next 行为 · 非生产</strong>
    <div style="margin-top:0.35rem">P0-6 首页瘦身：一句品牌 + 搜索 + 分类 chips + 真字精选行</div>
  </footer>

  <script src="js/vault-target.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      VaultTarget.mountFeatured(6);
    });
  </script>
</body>
</html>
