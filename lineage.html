<body class="page-lineage">
  <header data-topbar data-active="fonts"></header>

  <main class="container lg-page">
    <div class="hd-a-title" id="pageHead">
      <h1 id="heroTitle" class="t">字体谱系</h1>
      <span class="meta" id="heroMeta"></span>
    </div>

    <div class="lg-toolbar tb-a">
      <div class="left">
        <div class="seg" id="viewNav" role="tablist" aria-label="派生或品牌">
          <button type="button" data-view="derive" role="tab" aria-selected="true">派生</button>
          <button type="button" data-view="org" role="tab" aria-selected="false">品牌</button>
        </div>
        <div class="chips" id="famNav" aria-label="字族"></div>
      </div>
      <div class="lg-tools right" role="toolbar" aria-label="视图与画布">
        <div class="seg" id="modeNav" role="tablist" aria-label="视图模式">
          <button type="button" class="lg-mode" data-mode="plex" role="tab" title="聚焦：点开一款字体，查看它的上游与下游">聚焦</button>
          <button type="button" class="lg-mode" data-mode="flow" role="tab" title="图谱：滚轮缩放，可拖拽">图谱</button>
          <button type="button" class="lg-mode" data-mode="wall" role="tab" title="字墙：按年代查看样张">字墙</button>
        </div>
        <button type="button" class="width-btn" id="widthToggle" aria-pressed="false" title="全宽">全宽</button>
        <span class="lg-export" id="exportTools" role="group" aria-label="下载图谱">
          <button type="button" class="width-btn lg-export-btn" id="btnExportPng" title="下载 PNG 图片">PNG</button>
          <button type="button" class="width-btn lg-export-btn" id="btnExportSvg" title="下载 SVG 矢量图">SVG</button>
        </span>
        <span class="lg-flow-tools is-hidden" id="flowTools" hidden aria-hidden="true">
          <button type="button" class="lg-tool" id="btnZoomOut" title="缩小">−</button>
          <button type="button" class="lg-tool" id="btnZoomIn" title="放大">+</button>
          <button type="button" class="lg-tool" id="btnReset" title="重置视图">重置</button>
          <span class="lg-zoom" id="zoomLabel">100%</span>
        </span>
      </div>
    </div>

    <div class="lg-view-shell" id="viewShell">
      <div class="lg-flow-wrap" id="flowWrap">
        <div class="lfl-viewport" id="viewport" tabindex="0" aria-label="谱系关系图画布">
          <div class="lfl-stage" id="flowStage">
            <svg class="lfl-edges" id="edges" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"></svg>
            <div class="lfl-nodes" id="nodes"></div>
          </div>
          <div class="lfl-plex-pick" id="plexPick" hidden></div>
          <p class="lfl-empty" id="empty" hidden>暂无谱系数据。</p>
        </div>
      </div>

      <div class="lfl-wall" id="wall" hidden></div>

      <section class="lg-stage" id="stage" aria-live="polite">
        <div class="page-state" role="status"><p class="page-state-kicker">谱系</p><p>正在载入谱系</p></div>
      </section>
    </div>

    <p class="lg-foot" id="footNote">谱系按各字族公开的授权与出处整理，字体名以权利人定名为准；未收录的原作以灰字标注。</p>
