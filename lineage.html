<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <script>try{if(localStorage.getItem("wf-theme")==="dark")document.documentElement.setAttribute("data-theme","dark");if(localStorage.getItem("wf-scale")==="lg")document.documentElement.setAttribute("data-scale","lg");if(localStorage.getItem("wf-view")==="dev")document.documentElement.setAttribute("data-view","dev")}catch(e){}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>谱系 · 文风字体</title>
  <meta name="description" content="开源字体的传承谱系：每个字族一棵谱、一面墙，字体名用它自己的字型排印。" />
  <link rel="stylesheet" href="css/fonts.css?v=20260923u" />
  <link rel="stylesheet" href="css/tokens.css?v=20260923qa" />
  <link rel="stylesheet" href="css/base.css?v=20260924c" />
  <link rel="stylesheet" href="css/components.css?v=20260925k" />
  <link rel="stylesheet" href="css/site.css?v=20260925i" />
  <link rel="stylesheet" href="css/lineage.css?v=20260925b" />
  <link rel="icon" type="image/webp" href="assets/icon.webp" />
</head>
<body class="page-lineage">
  <header data-topbar data-active="fonts"></header>

  <main class="container">
    <div class="page-head">
      <h1 id="heroTitle">字有师承。</h1>
      <p class="lead">每一款开源字体都不是凭空来的。选一个字族，看它的上下传承——字体名用它自己的字型排印，谱系页本身就是样张。</p>
    </div>

    <div class="lg-toolbar row-between">
      <div class="chips" id="famNav" aria-label="字族"></div>
      <div class="seg" role="tablist" aria-label="视图模式">
        <button type="button" class="is-on" id="modeTree" role="tab" aria-selected="true">谱</button>
        <button type="button" id="modeWall" role="tab" aria-selected="false">墙</button>
      </div>
    </div>

    <p class="count-line" id="famCap"></p>

    <section class="lg-stage" id="stage" aria-live="polite">
      <p class="loading">正在加载谱系…</p>
    </section>

    <p class="lg-foot">谱系按各字族公开的授权与出处整理，字体名为权利人定名；上下游以「谁基于谁改作」为准，未收录的原作以灰字注出。</p>
  </main>

  <footer id="wfExtraFooter"></footer>

  <script src="js/wf-proto.js?v=20260927n"></script>
  <script src="js/wf-chrome.js?v=20260927e"></script>
  <script src="js/wf-products.js?v=20260923u"></script>
  <script src="js/wf-specimen.js?v=20260923j"></script>
  <script src="js/pages/lineage.js?v=20260925f"></script>
</body>
</html>
