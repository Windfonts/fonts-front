<body class="page-lineage">
  <header data-topbar data-active="fonts"></header>

  <main class="container">
    <div class="page-head">
      <h1 id="heroTitle">字有师承。</h1>
      <p class="lead">每一款开源字体都不是凭空来的。选一个字族，看它的上下传承——字体名用它自己的字型排印，谱系页本身就是样张。</p>
    </div>

    <div class="lg-toolbar row-between">
      <div class="chips" id="famNav" aria-label="字族"></div>
      <div class="seg" role="tablist" aria-label="视图模式">
        <button type="button" class="is-on" id="modeBranch" role="tab" aria-selected="true">支线</button>
        <button type="button" id="modeWall" role="tab" aria-selected="false">墙</button>
      </div>
    </div>

    <p class="count-line" id="famCap"></p>

    <section class="lg-stage" id="stage" aria-live="polite">
      <p class="loading">正在加载谱系…</p>
    </section>

    <p class="lg-foot">谱系按各字族公开的授权与出处整理，字体名为权利人定名；上下游以「谁基于谁改作」为准，未收录的原作以灰字注出。支线＝根卡+代际支线；墙＝分带样张格+左侧旁谱。</p>
  </main>
