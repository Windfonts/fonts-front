<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <script>try{if(localStorage.getItem("wf-theme")==="dark")document.documentElement.setAttribute("data-theme","dark")}catch(e){}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>项目 · 控制台 · 文风字体</title>
  <link rel="stylesheet" href="../css/fonts.css?v=20260923u" />
  <link rel="stylesheet" href="../css/tokens.css?v=20260923qa" />
  <link rel="stylesheet" href="../css/base.css?v=20260924c" />
  <link rel="stylesheet" href="../css/components.css?v=20260925k" />
  <link rel="stylesheet" href="../css/app.css?v=20260924q" />
  <link rel="icon" type="image/webp" href="../assets/icon.webp" />
</head>
<body class="app">
  <aside class="rail" data-rail data-active="projects"></aside>
  <main class="app-main" id="root"><p class="loading">正在加载…</p></main>

  <script src="../js/wf-proto.js?v=20260926ebhv"></script>
  <script src="../js/wf-chrome.js?v=20260926nolink"></script>
  <script src="../js/wf-auth.js?v=20260926sso2"></script>
  <script src="../js/wf-embed.js?v=20260924p"></script>
  <script src="../js/wf-app.js?v=20260926sso2"></script>
  <script src="../js/wf-api.js?v=20260926sso2"></script>
  <script>
    (function () {
      if (!WFApp.gate()) return;
      const esc = WFProto.escapeHtml;
      const root = document.getElementById('root');

      function render() {
        const s = WFApp.state();
        const ps = WFApp.projects();
        root.innerHTML =
          '<div class="app-head"><div><h1>项目</h1><p class="sub">' + ps.length + ' / ' + s.plan.quota.projects + ' · 每个项目一份嵌入代码、一组域名白名单、独立版本记录</p></div>' +
            '<div class="app-actions"><form class="inline-form" id="newForm"><input class="input" id="newName" placeholder="项目名称，如 品牌官网" aria-label="项目名称" required /><button type="submit" class="btn btn-ink">' + WFChrome.icon('plus') + '新建项目</button></form></div></div>' +
          (ps.length ? '<ul class="proj-list">' + ps.map(function (p) {
            const cur = WFApp.currentVersion(p);
            return '<li><a class="name" href="project.html?id=' + esc(p.id) + '">' + esc(p.name) + '<small>' + esc(p.slug) + ' · 创建于 ' + WFApp.fmtDate(p.createdAt).slice(0, 10) + '</small></a>' +
              '<span><span class="num">' + p.fonts.length + '</span> 字体 · <span class="num">' + WFEmbed.fmtBytes(WFApp.projectBytes(p)) + '</span></span>' +
              '<span class="hide-md"><span class="num">' + p.domains.filter(function (d) { return d.verified; }).length + '</span> / ' + p.domains.length + ' 域名已验证</span>' +
              '<span class="hide-md"><span class="num">' + WFApp.fmtGB(p.usage.bytes30d) + '</span> GB / 30 天</span>' +
              '<span>v' + cur.v + ' · ' + WFApp.fmtDate(cur.at).slice(5, 10) +
              ' <button type="button" class="btn-text" data-del="' + esc(p.id) + '">' + WFChrome.icon('trash') + '删除</button></span></li>';
          }).join('') + '</ul>'
          : '<p class="empty">还没有项目。上面输入名称新建一个。</p>');
        document.getElementById('newForm').addEventListener('submit', function (e) {
          e.preventDefault();
          const name = document.getElementById('newName').value.trim();
          if (!name) return;
          const btn = e.target.querySelector('[type=submit]');
          if (btn) btn.disabled = true;
          WFApi.createProject(name).then(function (p) {
            location.href = 'project.html?id=' + encodeURIComponent(p.id) + '&tab=fonts';
          }).catch(function (err) {
            WFChrome.toast((err && err.message) || '创建失败');
            if (btn) btn.disabled = false;
          });
        });
        root.querySelectorAll('[data-del]').forEach(function (b) {
          b.addEventListener('click', function (e) {
            e.preventDefault();
            const id = b.getAttribute('data-del');
            const p = WFApp.project(id);
            WFChrome.confirm({ title: '删除项目', message: '将删除「' + (p ? p.name : id) + '」及其域名、版本与用量记录。已对外的项目 CSS 会立刻失效。', ok: '删除' }).then(function (ok) {
              if (!ok) return;
              WFApi.deleteProject(id).then(function () {
                WFChrome.toast('已删除项目');
                render();
              }).catch(function (err) { WFChrome.toast((err && err.message) || '删除失败'); });
            });
          });
        });
        if (WFProto.getQuery('new')) document.getElementById('newName').focus();
      }
      Promise.all([WFProto.loadCatalog(), WFApp.load(), WFApi.listProjects()]).then(function () { render(); });
    })();
  </script>
</body>
</html>
