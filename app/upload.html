<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <script>try{if(localStorage.getItem("wf-theme")==="dark")document.documentElement.setAttribute("data-theme","dark")}catch(e){}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>上传字体 · 控制台 · 文风字体</title>
  <link rel="stylesheet" href="../css/fonts.css?v=20260923u" />
  <link rel="stylesheet" href="../css/tokens.css?v=20260923qa" />
  <link rel="stylesheet" href="../css/base.css?v=20260924c" />
  <link rel="stylesheet" href="../css/components.css?v=20260924n" />
  <link rel="stylesheet" href="../css/app.css?v=20260924q" />
  <link rel="icon" type="image/webp" href="../assets/icon.webp" />
</head>
<body class="app">
  <aside class="rail" data-rail data-active="fonts"></aside>
  <main class="app-main">
    <div class="app-head"><div><p class="crumb"><a href="fonts.html">我的字体</a><span>/</span><span>上传</span></p><h1>上传字体</h1>
      <p class="sub">支持 .ttf .otf .woff .woff2。上传后自动解析名称、字重、字符数，并生成全部格式；享受同样的子集化与托管。</p></div></div>

    <form id="uploadForm" class="grid" style="grid-template-columns:minmax(0,1fr) 20rem;gap:var(--s-12);align-items:start">
      <div class="stack">
        <label class="drop" id="drop"><input type="file" id="file" accept=".ttf,.otf,.woff,.woff2" /><strong>拖入字体文件</strong>，或点击选择<br><span class="t-13" id="fileName">单个文件 ≤ 30 MB</span></label>
        <div class="grid" style="grid-template-columns:1fr 1fr">
          <div class="field"><label for="upName">字体名称</label><input class="input" id="upName" placeholder="解析后自动填入，可改" /></div>
          <div class="field"><label for="upWeight">字重</label><select class="select" id="upWeight"><option value="Thin">Thin 100</option><option value="Light">Light 300</option><option value="Regular" selected>Regular 400</option><option value="Medium">Medium 500</option><option value="Bold">Bold 700</option><option value="Black">Black 900</option></select></div>
        </div>
        <div class="field"><label for="upFamily">嵌入用名称</label><input class="input mono" id="upFamily" placeholder="custom-your-font" /><span class="hint">只用小写字母、数字和连字符，写进嵌入代码。</span></div>
        <div class="field"><label for="upLicense">授权来源</label><select class="select" id="upLicense"><option>自己设计或委托设计</option><option>已购买商业授权（含网页嵌入）</option><option>开源许可（OFL / Apache 等）</option></select></div>
        <label class="check"><input type="checkbox" id="upAgree" required /> 我已确认有权在网页里用这款字体，并同意<a href="../upload-terms.html">《上传条款》</a>。</label>
      </div>
      <aside class="subset-side">
        <dl class="kv">
          <div><dt><svg class="icon" aria-hidden="true"><use href="../assets/icons.svg?v=20260922ri#i-box"/></svg>文件</dt><dd class="num" id="kvSize">—</dd></div>
          <div><dt><svg class="icon" aria-hidden="true"><use href="../assets/icons.svg?v=20260922ri#i-code"/></svg>格式</dt><dd class="mono" id="kvFormat">—</dd></div>
          <div><dt><svg class="icon" aria-hidden="true"><use href="../assets/icons.svg?v=20260922ri#i-download"/></svg>产物</dt><dd class="mono">woff2 · woff · ttf</dd></div>
          <div><dt><svg class="icon" aria-hidden="true"><use href="../assets/icons.svg?v=20260922ri#i-cloud"/></svg>配额</dt><dd class="num" id="kvQuota">—</dd></div>
        </dl>
        <button type="submit" class="btn btn-ink btn-lg" id="btnUpload" disabled><svg class="icon" aria-hidden="true"><use href="../assets/icons.svg?v=20260922ri#i-upload"/></svg>上传并解析</button>
        <p class="t-12 muted">上传的字体仅对你的项目可见，不会进入公开字体库。</p>
      </aside>
    </form>
  </main>

  <script src="../js/wf-proto.js?v=20260924p"></script>
  <script src="../js/wf-chrome.js?v=20260923qc"></script>
  <script src="../js/wf-embed.js?v=20260924p"></script>
  <script src="../js/wf-app.js?v=20260924q"></script>
  <script>
    (function () {
      if (!WFApp.gate()) return;
      const drop = document.getElementById('drop');
      const file = document.getElementById('file');
      const name = document.getElementById('upName');
      const fam = document.getElementById('upFamily');
      const agree = document.getElementById('upAgree');
      const btn = document.getElementById('btnUpload');
      let picked = null;

      function slug(s) { return s.toLowerCase().replace(/\.[a-z0-9]+$/, '').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, ''); }
      let locked = false;
      function check() {
        if (locked) { btn.disabled = true; return; }
        btn.disabled = !(picked && agree.checked && name.value.trim() && /^[a-z0-9-]+$/.test(fam.value));
      }
      WFApp.load().then(function () {
        if (WFApp.isPro()) return;
        locked = true;
        btn.disabled = true;
        const note = document.createElement('p');
        note.className = 't-13 muted';
        note.style.marginTop = '1rem';
        note.textContent = '上传自有授权字是专业档。免费档只用公共库。';
        btn.insertAdjacentElement('afterend', note);
      });
      function u16(view, o) { return view.getUint16(o); }
      function tagAt(view, o) {
        return String.fromCharCode(view.getUint8(o), view.getUint8(o + 1), view.getUint8(o + 2), view.getUint8(o + 3));
      }
      function readName(view, start, length, utf16) {
        let s = '';
        if (utf16) {
          for (let j = 0; j + 1 < length; j += 2) s += String.fromCharCode(view.getUint16(start + j));
        } else {
          for (let j = 0; j < length; j++) s += String.fromCharCode(view.getUint8(start + j));
        }
        return s.replace(/\0/g, '').trim();
      }
      function parseSfnt(buf) {
        const view = new DataView(buf);
        const sig = tagAt(view, 0);
        if (sig !== '\u0000\u0001\u0000\u0000' && sig !== 'OTTO' && sig !== 'true' && sig !== 'typ1') return null;
        const num = u16(view, 4);
        let nameOff = 0, os2 = 0, maxp = 0;
        for (let i = 0; i < num && i < 80; i++) {
          const rec = 12 + i * 16;
          const t = tagAt(view, rec);
          const off = view.getUint32(rec + 8);
          if (t === 'name') nameOff = off;
          if (t === 'OS/2') os2 = off;
          if (t === 'maxp') maxp = off;
        }
        const out = { family: '', weight: os2 ? u16(view, os2 + 4) : 400, glyphs: maxp ? u16(view, maxp + 4) : 0 };
        if (!nameOff) return out;
        const count = u16(view, nameOff + 2);
        const strOff = u16(view, nameOff + 4);
        for (let i = 0; i < count && i < 80; i++) {
          const r = nameOff + 6 + i * 12;
          const platform = u16(view, r);
          const nameId = u16(view, r + 6);
          const length = u16(view, r + 8);
          const offset = u16(view, r + 10);
          if (nameId !== 1 && nameId !== 4 && nameId !== 16) continue;
          const text = readName(view, nameOff + strOff + offset, length, platform === 3 || platform === 0);
          if (!text) continue;
          if (nameId === 4 || nameId === 16) out.family = text;
          else if (!out.family) out.family = text;
        }
        return out;
      }
      function weightOption(n) {
        const steps = [100, 300, 400, 500, 700, 900];
        const labels = ['Thin', 'Light', 'Regular', 'Medium', 'Bold', 'Black'];
        let best = 2;
        steps.forEach(function (s, i) { if (Math.abs(s - n) < Math.abs(steps[best] - n)) best = i; });
        return labels[best];
      }
      function take(f) {
        if (!f) return;
        if (!/\.(ttf|otf|woff2?)$/i.test(f.name)) { WFChrome.toast('只支持 ttf / otf / woff / woff2'); return; }
        if (f.size > 30 * 1024 * 1024) { WFChrome.toast('文件超过 30 MB'); return; }
        picked = f;
        picked.glyphs = 0;
        document.getElementById('fileName').textContent = f.name;
        document.getElementById('kvSize').textContent = WFEmbed.fmtBytes(f.size);
        document.getElementById('kvFormat').textContent = f.name.split('.').pop().toLowerCase();
        if (!name.value) name.value = f.name.replace(/\.[a-z0-9]+$/i, '').replace(/[-_]+/g, ' ');
        if (!fam.value) fam.value = 'custom-' + slug(f.name);
        check();
        if (!/\.(ttf|otf)$/i.test(f.name)) return;
        f.arrayBuffer().then(function (buf) {
          const meta = parseSfnt(buf);
          if (!meta) return;
          if (meta.family) name.value = meta.family;
          if (meta.glyphs) picked.glyphs = meta.glyphs;
          if (meta.weight) document.getElementById('upWeight').value = weightOption(meta.weight);
          if (meta.family) fam.value = 'custom-' + slug(meta.family);
          check();
        }).catch(function () { WFChrome.toast('没能从文件里读出名称，已用文件名'); });
      }
      file.addEventListener('change', function () { take(file.files[0]); });
      ['dragenter', 'dragover'].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add('is-over'); }); });
      ['dragleave', 'drop'].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove('is-over'); }); });
      drop.addEventListener('drop', function (e) { take(e.dataTransfer.files[0]); });
      [name, fam, agree].forEach(function (el) { el.addEventListener('input', check); el.addEventListener('change', check); });

      document.getElementById('uploadForm').addEventListener('submit', function (e) {
        e.preventDefault();
        if (btn.disabled) return;
        const s = WFApp.state();
        s.uploads.unshift({
          id: 'up-' + Date.now().toString(36), name: name.value.trim(), family: fam.value, weights: [document.getElementById('upWeight').value],
          glyphCount: picked.glyphs || Math.round(picked.size / 320), format: picked.name.split('.').pop().toLowerCase(), size: picked.size,
          uploadedAt: new Date().toISOString(), status: 'ready'
        });
        WFApp.log('上传字体', name.value.trim());
        WFApp.save();
        WFChrome.toast('已上传。下一步把它加入项目');
        location.href = 'fonts.html';
      });

      WFApp.load().then(function (s) {
        document.getElementById('kvQuota').textContent = s.uploads.length + ' / ' + s.plan.quota.fonts + ' 款';
      });
    })();
  </script>
</body>
</html>
