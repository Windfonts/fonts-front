<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <script>try{if(localStorage.getItem("wf-theme")==="dark")document.documentElement.setAttribute("data-theme","dark");if(localStorage.getItem("wf-scale")==="lg")document.documentElement.setAttribute("data-scale","lg");if(localStorage.getItem("wf-view")==="dev")document.documentElement.setAttribute("data-view","dev")}catch(e){}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>字体库 · 文风字体</title>
  <link rel="stylesheet" href="css/fonts.css?v=20260925s" />
  <link rel="stylesheet" href="css/tokens.css?v=20260925t" />
  <link rel="stylesheet" href="css/base.css?v=20260925s" />
  <link rel="stylesheet" href="css/components.css?v=20260925s" />
  <link rel="stylesheet" href="css/specimen.css?v=20260925w" />
  <link rel="stylesheet" href="css/site.css?v=20260925s" />
  <link rel="icon" type="image/webp" href="assets/icon.webp" />
</head>
<body class="page-fonts">
  <header data-topbar data-active="fonts"></header>
  <div id="controlbar"></div>

  <main class="container">
    <div class="lib">
      <aside class="lib-rail" aria-label="筛选">
        <details class="lib-rail-fold" id="libRailFold">
          <summary>筛选</summary>
          <div id="libRail"></div>
        </details>
      </aside>
      <section>
        <div class="count-line row-between">
          <span id="countLine">正在加载字体目录…</span>
          <div class="lib-active" id="activeFilters"></div>
          <label class="lib-sort"><span class="sr-only">排序</span><select class="select" id="sortSel" aria-label="排序"><option value="featured">推荐排序</option><option value="popular">按热门</option><option value="name">按名称</option><option value="weights">字重多到少</option><option value="newest">最新发布</option></select></label>
        </div>
        <ul class="specimens" id="fontList"></ul>
        <div class="load-more"><button type="button" class="btn" id="loadMore" hidden><svg class="icon" aria-hidden="true"><use href="assets/icons.svg?v=20260925s#i-more"/></svg>加载更多</button></div>
        <div id="listSentinel" aria-hidden="true"></div>
      </section>
    </div>
  </main>

  <footer id="wfExtraFooter"></footer>

  <script src="js/wf-proto.js?v=20260926geelyinv"></script>
  <script src="js/wf-chrome.js?v=20260926geelyinv"></script>
  <script src="js/wf-products.js?v=20260925s"></script>
  <script src="js/wf-specimen.js?v=20260925s"></script>
  <script src="js/pages/fonts.js?v=20260925t"></script>
</body>
</html>
