<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <script>try{if(localStorage.getItem("wf-theme")==="dark")document.documentElement.setAttribute("data-theme","dark");if(localStorage.getItem("wf-view")==="dev")document.documentElement.setAttribute("data-view","dev")}catch(e){}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>选字袋 · 文风字体</title>
  <link rel="stylesheet" href="css/fonts.css" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css?v=20260921x" />
  <link rel="stylesheet" href="css/specimen.css?v=20260921x" />
  <link rel="stylesheet" href="css/site.css" />
  <link rel="icon" type="image/webp" href="assets/icon.webp" />
</head>
<body class="page-bag">
  <header data-topbar></header>

  <main class="container">
    <div class="bag-head">
      <h1>选字袋 <span class="num" id="bagCount">0</span></h1>
      <div class="row">
        <div class="bag-views seg" id="bagViews" hidden role="tablist" aria-label="视图">
          <button type="button" data-view="rows" class="is-on">样张</button>
          <button type="button" data-view="compare">对比</button>
        </div>
        <button type="button" class="btn-text" id="btnClear">清空</button>
        <a class="btn btn-ink" id="btnToProject" href="login.html?next=bag">添加到项目</a>
      </div>
    </div>
  </main>
  <div id="controlbar"></div>
  <main class="container">
    <ul class="specimens" id="bagList"></ul>
    <div id="bagCompare" hidden></div>

    <section class="bag-embed" id="bagEmbed" hidden>
      <div>
        <h2>合并嵌入代码</h2>
        <div id="embed"></div>
        <p class="use-note t-13 muted" style="margin-top:var(--s-3)">一次引入选字袋里的全部字体。估算总体积 <strong class="num" id="bagBytes">—</strong>（woff2，按所选子集）。</p>
      </div>
      <div class="opts">
        <div class="field"><label>子集</label><select class="select" id="optVersion">
          <option value="full">完整</option><option value="zh">中文 7000</option><option value="zh-common" selected>常用 3500</option><option value="en">拉丁</option></select></div>
        <div class="field"><label>字重</label><select class="select" id="optWeights">
          <option value="first">仅常规 / 首个字重</option><option value="all">全部字重</option></select></div>
        <div class="field"><label>font-display</label><select class="select" id="optDisplay">
          <option value="">默认（swap）</option><option value="swap">swap</option><option value="block">block</option><option value="fallback">fallback</option><option value="optional">optional</option></select></div>
        <label class="check"><input type="checkbox" id="optPreload" /> 生成 preload 提示</label>
      </div>
    </section>
  </main>

  <footer id="wfExtraFooter"></footer>

  <script src="js/wf-proto.js"></script>
  <script src="js/wf-chrome.js"></script>
  <script src="js/wf-specimen.js?v=20260921x"></script>
  <script src="js/wf-embed.js"></script>
  <script src="js/pages/bag.js?v=20260921x"></script>
</body>
</html>
