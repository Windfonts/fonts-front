<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <script>try{if(localStorage.getItem("wf-theme")==="dark")document.documentElement.setAttribute("data-theme","dark");if(localStorage.getItem("wf-scale")==="lg")document.documentElement.setAttribute("data-scale","lg");if(localStorage.getItem("wf-view")==="dev")document.documentElement.setAttribute("data-view","dev")}catch(e){}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>选字袋 · 文风字体</title>
  <link rel="preconnect" href="https://cn.windfonts.com" crossorigin />
  <link rel="dns-prefetch" href="https://cn.windfonts.com" />
  <link rel="preload" as="font" type="font/woff2" crossorigin href="https://cn.windfonts.com/fonts-packages/Albbpht/Regular/zh-common/2.woff2" />
  <link rel="preload" as="font" type="font/woff2" crossorigin href="https://cn.windfonts.com/fonts-packages/Hckht/Medium/full/16.woff2" />
  <link rel="preload" as="font" type="font/woff2" crossorigin href="https://cn.windfonts.com/fonts-packages/Hckht/Medium/full/18.woff2" />
  <link rel="preload" as="font" type="font/woff2" crossorigin href="https://cn.windfonts.com/fonts-packages/Hckht/Medium/full/15.woff2" />
  <link rel="preload" as="font" type="font/woff2" crossorigin href="https://cn.windfonts.com/fonts-packages/Hckht/Medium/full/19.woff2" />
  <link rel="stylesheet" href="/css/fonts.css?v=20260929ui1" media="print" onload="this.media='all'" />
  <noscript><link rel="stylesheet" href="/css/fonts.css?v=20260929ui1" /></noscript>
  <link rel="stylesheet" href="/css/tokens.css?v=20260929ui1" />
  <link rel="stylesheet" href="/css/base.css?v=20260929ui1" />
  <link rel="stylesheet" href="/css/components.css?v=20260929ui1" />
  <link rel="stylesheet" href="/css/specimen.css?v=20260929ui1" />
  <link rel="stylesheet" href="/css/site.css?v=20260929ui1" />
  <link rel="icon" type="image/webp" href="/assets/icon.webp" />
</head>
<body class="page-bag">
  <header data-topbar></header>

  <main class="container">
    <div class="bag-head">
      <h1>选字袋 <span class="num" id="bagCount">0</span></h1>
      <div class="row">
        <div class="bag-views seg" id="bagViews" hidden role="tablist" aria-label="视图">
          <button type="button" data-view="rows" class="is-on">样张</button>
          <button type="button" data-view="pair">配对</button>
          <button type="button" data-view="compare">对比</button>
        </div>
        <button type="button" class="btn-text" id="btnClear"><svg class="icon" aria-hidden="true"><use href="/assets/icons.svg?v=20260929ui1#i-trash"/></svg>清空</button>
        <a class="btn btn-ink" id="btnToProject" href="/login?next=bag"><svg class="icon" aria-hidden="true"><use href="/assets/icons.svg?v=20260929ui1#i-plus"/></svg>添加到项目</a>
      </div>
    </div>
  </main>
  <div id="controlbar"></div>
  <main class="container">
    <ul class="specimens" id="bagList"></ul>
    <div id="bagPair" hidden></div>
    <div id="bagCompare" hidden></div>

    <section class="bag-embed" id="bagEmbed" hidden>
      <div class="bag-embed-head">
        <h2><svg class="icon" aria-hidden="true"><use href="/assets/icons.svg?v=20260929ui1#i-code"/></svg>合并嵌入代码</h2>
      </div>
      <div class="opts">
        <div class="field"><label>子集</label><select class="select" id="optVersion">
          <option value="zh-common" selected>常用</option>
          <option value="zh">中文</option>
          <option value="en">西文</option>
          <option value="full">完整</option></select></div>
        <div class="field"><label>字重</label><select class="select" id="optWeights">
          <option value="first">只用常规字重</option><option value="all">全部字重</option></select></div>
        <div class="field"><label>加载策略</label><select class="select" id="optDisplay">
          <option value="">默认（swap）</option><option value="swap">swap</option><option value="block">block</option><option value="fallback">fallback</option><option value="optional">optional</option></select></div>
        <label class="check"><input type="checkbox" id="optPreload" /> 提前加载字体</label>
      </div>
      <div class="bag-embed-main">
        <div id="embed"></div>
        <p class="use-note t-13 muted">一次引入选字袋里的全部字体。估算总体积 <strong class="num" id="bagBytes">—</strong>（按所选子集）。</p>
      </div>
    </section>
  </main>

  <footer id="wfExtraFooter"></footer>

  <script defer src="/js/wf-proto.js?v=20260929g7"></script>
  <script defer src="/js/wf-chrome.js?v=20260929ui3"></script>
  <script defer src="/js/wf-products.js?v=20260929ui1"></script>
  <script defer src="/js/wf-specimen.js?v=20260929ui7"></script>
  <script defer src="/js/wf-embed.js?v=20260929ui1"></script>
  <script defer src="/js/pages/bag.js?v=20260929ui5"></script>
</body>
</html>
